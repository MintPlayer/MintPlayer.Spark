<spark-shell [title]="'app.title' | t" breakpoint="md" sidebarTheme="dark">
  <!--
    Replaces the slot's default (<spark-language-selector/>), so the language
    selector is re-rendered here explicitly — omitting it would silently drop it.
    The sign-in control is a plain link to /sign-in, which renders one button per provider
    the server reports. It is app-owned only because this topbar slot is; there is nothing
    forge-specific left in it.
  -->
  <div *sparkShellTopbarEnd class="d-flex align-items-center gap-2">
    @if (lang.languages() | keyvalue; as langs) {
      @if (langs.length > 1) {
        <bs-select [ngModel]="lang.language()"
                   (ngModelChange)="lang.setLanguage($event)">
          @for (l of langs; track l.key) {
            <option [ngValue]="l.key">{{ l.value | resolveTranslation }}</option>
          }
        </bs-select>
      }
    }
    <!--
      The library bar, not a hand-written copy of it. It renders the user, the passkey link and
      logout when signed in, and the sign-in link otherwise — and it decides whether to offer
      passkeys from the SERVER's capabilities plus browser support, which this app could not do
      from a routerLink. Its sign-in target resolves to loginUrl, which app.config.ts sets to
      '/sign-in', so the destination is unchanged.

      The passkey page is deliberately not a programUnits.json entry: the sidebar is two units, and
      a credential page is account plumbing rather than a program unit.
    -->
    <spark-auth-bar />
  </div>

  <ng-container *sparkShellMainHeader>
    @if (loginError(); as error) {
      <bs-alert [type]="dangerColor" [announce]="true" class="d-block mb-3"
                (isVisibleChange)="onLoginAlertVisible($event)">
        <i class="bi bi-exclamation-triangle"></i> {{ error }}
        <bs-alert-close />
      </bs-alert>
    }
  </ng-container>

  <router-outlet />
</spark-shell>
