# clamd.conf for CodeCoverage's coverage-clamav service (#700 M11). Mounted read-only over /etc/clamav/clamd.conf.
# It is MintPlayer.Spark.Files.ClamAV's clamd.conf (libs/files/MintPlayer.Spark.Files.ClamAV/clamd.conf) plus the
# memory setting at the end. ClamdConfTests checks that every directive of the package's file is here with its value.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Fail-closed limits (PRD SP4, M7): an archive hiding an over-limit payload answers Heuristics.Limits.Exceeded.* FOUND.
AlertExceedsMax yes
StreamMaxLength 25M
MaxFileSize 100M
MaxScanSize 100M

# The shared 8 GB VPS (owner, 2026-11-22): no second signature database in memory during freshclam's reload, so no
# ~2 GiB peak. Scans wait for the reload instead (a few seconds a day); an upload is never served unscanned.
ConcurrentDatabaseReload no
