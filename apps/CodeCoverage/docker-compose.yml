services:

  coverage-raven:
    # Pinned (not 7.1-latest): floating tags have previously advanced to builds
    # that reject unsecured access on a 0.0.0.0 bind, breaking deploys on a
    # plain `docker compose pull`.
    image: docker.io/ravendb/ravendb:7.1.10-ubuntu.22.04-x64
    environment:
      - RAVEN_Setup_Mode=None
      # SECURED (SeoTester PRD D55/D56): HTTPS with client certificates, nothing unsecured. Every client presents a
      # certificate registered on this server: coverage-app may use only the database Coverage, seotester-app only
      # SeoTester, and the operator certificate (the owner's, and the licence one-shot's) is the only administrator.
      # The server certificate is issued by the private CA of the runbook for the host name coverage-raven;
      # the apps trust that CA through Spark:RavenDb:ServerCertificateAuthorityFile.
      # One-time migration of the live server: docs/code-coverage/raven-tls-migration.md.
      - RAVEN_ServerUrl=https://0.0.0.0:8080
      - RAVEN_ServerUrl_Tcp=tcp://0.0.0.0:38888
      # What clients are told in the topology: must be the certificate's name, or every client refuses the name.
      - RAVEN_PublicServerUrl=https://coverage-raven:8080
      - RAVEN_PublicServerUrl_Tcp=tcp://coverage-raven:38888
      - RAVEN_Security_Certificate_Path=/run/secrets/raven/server.pfx
      - RAVEN_Security_Certificate_Password=${RAVEN_SERVER_CERTIFICATE_PASSWORD:?RAVEN_SERVER_CERTIFICATE_PASSWORD is not set in .env (docs/code-coverage/raven-tls-migration.md)}
      # The operator certificate's SHA-1 thumbprint: a cluster administrator without being registered first. App
      # certificates are registered by the operator (runbook), never through this setting.
      - RAVEN_Security_WellKnownCertificates_Admin=${RAVEN_OPERATOR_THUMBPRINT:?RAVEN_OPERATOR_THUMBPRINT is not set in .env (docs/code-coverage/raven-tls-migration.md)}
      # No licence settings here on purpose. Measured against this exact image
      # (7.1.10): a licence supplied through *configuration* is silently ignored
      # — RAVEN_License (inline JSON), RAVEN_License_Path, --License.Path via
      # RAVEN_ARGS, RAVEN_SETTINGS and an embedded License object in
      # settings.json were each tried, and every one left the server on
      # "AGPL - Open Source" with nothing in the log. The licence is applied by
      # the coverage-raven-license service below, which is what actually works.
    volumes:
      - raven-data:/var/lib/ravendb/data
      # Only the server certificate (PKCS#12, password in .env). No client key and not the CA's key.
      - ./raven-certs/server.pfx:/run/secrets/raven/server.pfx:ro
    # Two networks, both internal (no egress): RavenDB needs none. Activating a valid, unexpired licence makes no
    # outbound call (Raven.Server 7.1 LicenseManager.ActivateAsync); without egress the daily licence lease to
    # api.ravendb.net fails with a warning alert and nothing else, so a renewed licence is applied by replacing
    # raven-license.json and re-running coverage-raven-license (SeoTester PRD D55).
    networks:
      - coverage-db
      # Shared with SeoTester's app only (apps/SeoTester/docker-compose.yml), which reaches this service by the same
      # name. External: created by either deploy, never removed by either stack's up/down.
      - seo-raven
      # Likewise shared with mintplayer.com's app only (apps/MintPlayer/docker-compose.yml).
      - mintplayer-raven
    # No curl/wget assumptions: bash's /dev/tcp is enough for "is it listening".
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # One-shot: POSTs ./raven-license.json to Raven's activation endpoint, then exits. The
  # licence lands in the system database, so it survives restarts and container
  # recreation (it lives in the raven-data volume) — this only has to succeed
  # once, and re-running it with the same licence is a no-op (verified).
  #
  # Runs on every `up` so a recreated volume re-licenses itself instead of
  # quietly reverting to AGPL. Without ./raven-license.json the POST fails, this
  # container exits non-zero and the deployment carries on unlicensed, exactly
  # as it did before — coverage-app deliberately does not depend on it.
  #
  # The endpoint is a cluster-admin one, so this is the one container that gets the operator certificate (the
  # apps never do). The server's name is checked against the private CA (--cacert).
  coverage-raven-license:
    image: curlimages/curl:8.11.1
    depends_on:
      coverage-raven:
        condition: service_healthy
    volumes:
      - ./raven-license.json:/raven-license.json:ro
      - ./raven-operator/operator.crt:/run/secrets/raven/operator.crt:ro
      - ./raven-operator/operator.key:/run/secrets/raven/operator.key:ro
      - ./raven-certs/ca.crt:/run/secrets/raven/ca.crt:ro
    networks:
      - coverage-db
    # curl IS the entrypoint, so this is an argument list.
    command:
      - "-sS"
      - "-f"
      - "--retry"
      - "10"
      - "--retry-delay"
      - "3"
      - "--retry-connrefused"
      - "-X"
      - "POST"
      - "-H"
      - "Content-Type: application/json"
      - "--data-binary"
      - "@/raven-license.json"
      - "--cert"
      - "/run/secrets/raven/operator.crt"
      - "--key"
      - "/run/secrets/raven/operator.key"
      - "--cacert"
      - "/run/secrets/raven/ca.crt"
      - "https://coverage-raven:8080/admin/license/activate"
    restart: "no"

  # The commit-graph mirror sidecar (#504, docs/coverage_commit_graph_PRD.md D1, D3, D4, D18, D24): git, bare
  # treeless mirrors of the repositories whose graph someone opened, lane layout. It holds no GitHub App key, no
  # RavenDB certificate and no stored credential; the app hands it a token per fetch.
  #
  # ⚠️ Its API has NO authentication: the network is the boundary (D4). It must stay on exactly these two networks:
  #   coverage-git         (internal) shared with coverage-app ONLY. Adding any other container to it exposes the
  #                        private commit history of every mirrored repository to that container.
  #   coverage-git-egress  its own way out to the forges, shared with NOTHING (D18).
  # Never on coverage-db, seo-raven or web (D24): no network carries both RavenDB and this sidecar.
  coverage-git:
    # Pull-only, like the app; built and pushed by code-coverage-deploy.yml.
    image: ghcr.io/mintplayer/codecoverage-git:master
    environment:
      - GitMirror__Root=/data/git
      # The host free-space floor (D8, D20): below it every clone and fetch is refused. The named volume lives on the
      # root disk RavenDB shares, so this guards the database's disk. 15 GB placeholder until S2's numbers (D7).
      - GitMirror__MinFreeBytes=${GIT_MIRROR_MIN_FREE_BYTES:-16106127360}
    volumes:
      # Mirrors only, mounted into this container only (D8). The app has no mount; it learns sizes from the sidecar.
      - codecoverage-git-data:/data/git
    # D22: the VPS has about 3 GB available, and lazy snapshots must not take RavenDB's share.
    mem_limit: 1g
    networks:
      - coverage-git
      - coverage-git-egress
    restart: unless-stopped

  # The merge queue's git writer (docs/coverage_merge_queue_PRD.md D2, M3): per job a bare, blob-less clone, the merge-tree
  # resolver, commit-tree and a leased push to mq/<base>/pr-<n> or the pull request's branch. It holds no GitHub App key, no
  # RavenDB certificate and no stored credential; the app mints a short-lived, single-repository token per request.
  #
  # ⚠️ Its API has NO authentication and can PUSH: the network is the boundary. It must stay on exactly these two networks:
  #   coverage-git-writer         (internal) shared with coverage-app ONLY.
  #   coverage-git-writer-egress  its own way out to the forges, shared with NOTHING.
  # Never on coverage-db, coverage-git, seo-raven or web: the read-only mirror keeps its own boundary (D2).
  coverage-git-writer:
    # Pull-only, like the app; built and pushed by code-coverage-deploy.yml.
    image: ghcr.io/mintplayer/codecoverage-git-writer:master
    environment:
      - GitWriter__Root=/data/jobs
      # One job at a time (S8): the memory and pids limits below are sized for one. Raising it to 2 needs
      # mem_limit 1280m and pids_limit 192 as well (docs/code-coverage/hosting.md).
      - GitWriter__MaxConcurrentJobs=1
    volumes:
      # Job directories only, each deleted when its job ends; mounted into this container only.
      - codecoverage-git-writer-jobs:/data/jobs
    # S8's job caps: 512 MB of memory and 64 processes for the job, plus 256 MB and 64 for the .NET host. The 1 GB disk cap
    # per job and the wall clock are enforced in-process (GitWriter__MaxJobBytes, GitWriter__JobTimeoutSeconds).
    mem_limit: 768m
    pids_limit: 128
    # Nothing but the jobs volume and a small /tmp is writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    networks:
      - coverage-git-writer
      - coverage-git-writer-egress
    restart: unless-stopped

  coverage-app:
    # Pull-only: no build block, so `docker compose up -d` on the VPS can
    # never fall back to building from source — deploys are pull + restart.
    image: ghcr.io/mintplayer/codecoverage:master
    # Long enough for an in-flight message handler to finish on SIGTERM. Docker's default is
    # 10 seconds, which is not enough for coverage report parsing, and a handler killed
    # mid-flight leaves its message claimed until SparkMessagingOptions.ClaimTtl (5 min)
    # lapses and the sweeper reclaims it — so the work is not lost, but it is delayed and
    # partially re-run. Keep this comfortably BELOW ClaimTtl: a grace period longer than the
    # claim would let the sweeper hand the message to a new container while the old one is
    # still working on it.
    stop_grace_period: 120s
    depends_on:
      coverage-raven:
        condition: service_healthy
      # Started, not waited on: the commit graph answers "unavailable" without it, and a sidecar that is slow to come up
      # must not hold back the whole deployment. (The mail relay is not listed: it is its own compose project,
      # apps/MailRelay, and a message the app cannot hand over is retried by MailManager.)
      coverage-git:
        condition: service_started
      # Started, not waited on: only the merge queue uses it, and its jobs are retried.
      coverage-git-writer:
        condition: service_started
    environment:
      # Explicit: Program.cs derives the GitHub__{env}__* config prefix from
      # the environment name — anything else silently disables sign-in.
      - ASPNETCORE_ENVIRONMENT=Production
      # The secured server: this app's own client certificate (registered with Admin on the database Coverage
      # and nothing else) and the private CA that issued the server's certificate.
      - Spark__RavenDb__Urls__0=https://coverage-raven:8080
      - Spark__RavenDb__CertificateFile=/run/secrets/raven/codecoverage.crt
      - Spark__RavenDb__CertificateKeyFile=/run/secrets/raven/codecoverage.key
      - Spark__RavenDb__ServerCertificateAuthorityFile=/run/secrets/raven/ca.crt
      # Off: creating a database is a cluster-admin operation this certificate is refused. The database exists
      # (the operator creates a new one, runbook); listing the databases, which startup still does, is allowed.
      - Spark__RavenDb__EnsureDatabaseCreated=false
      # Data Protection key ring (auth + antiforgery cookies decrypt with it). Kept on the
      # dataprotection-keys volume so a redeploy does not sign everyone out; Spark refuses to
      # start in Production without a location. appsettings.json deliberately sets no
      # Storage, because KeysPath and Storage=RavenDb together also refuse startup.
      - Spark__DataProtection__KeysPath=/var/lib/codecoverage/dataprotection-keys
      # OIDC audience: workflows must request an id-token with this audience
      - Coverage__BaseUrl=https://coverage.mintplayer.com
      # Signs the per-pull-request badge URL the bot puts in a PR comment, so a
      # private repository's comment never carries the repo-wide badge token.
      # Unset degrades those comments to text-only numbers; rotating it only
      # invalidates the badge images inside comments already posted.
      - Coverage__BadgeSigningKey=${COVERAGE_BADGE_SIGNING_KEY:-}
      - GitHub__WebhookSecret=${GITHUB_WEBHOOK_SECRET}
      - GitHub__Production__AppId=${GITHUB_APP_ID}
      # Optional: the App's public slug (github.com/apps/<slug>) for "install
      # the App" links; empty falls back to the generic apps page.
      - GitHub__Production__AppSlug=${GITHUB_APP_SLUG:-}
      # Optional dev App id: webhooks arriving for THAT app are not processed
      # here but downstreamed to connected dev clients (single webhook URL).
      - GitHub__Development__AppId=${GITHUB_DEVELOPMENT_APP_ID:-}
      - GitHub__Production__ClientId=${GITHUB_APP_CLIENT_ID}
      - GitHub__Production__ClientSecret=${GITHUB_APP_CLIENT_SECRET}
      - GitHub__Production__PrivateKeyPath=/run/secrets/github-app.pem
      # Outgoing mail through Spark MailManager (#460 M8; was Coverage__Mail__*). The .env
      # variables are the same ones as before. MailManager is added only when Host AND
      # From:Address are set, so an unset MAIL_FROM_ADDRESS still means "this deployment
      # cannot send" — supported as long as ExternalLoginLinking is not ConfirmByEmail
      # (startup refuses that combination rather than discarding confirmations silently).
      # Security=None: the shared relay (apps/MailRelay) is reachable from this app only on
      # coverage-mail and advertises STARTTLS it has no certificate for; None never sends
      # STARTTLS (spike S-M6), exactly what the old System.Net.Mail client (EnableSsl=false) did.
      - Spark__Mail__Smtp__Host=${MAIL_HOST:-mail-relay}
      - Spark__Mail__Smtp__Port=${MAIL_PORT:-587}
      - Spark__Mail__Smtp__Security=None
      - Spark__Mail__From__Address=${MAIL_FROM_ADDRESS:-}
      - Spark__Mail__From__Name=${MAIL_FROM_NAME:-MintPlayer Coverage}
      # Links in mail are built from this, never from the request Host (#460 M5).
      - Spark__Auth__PublicBaseUrl=https://coverage.mintplayer.com
      # Disabled | WhenSignedIn | ConfirmByEmail. Left at the Spark default (Disabled)
      # until there is a second forge worth linking to.
      - Spark__Auth__ExternalLoginLinking=${EXTERNAL_LOGIN_LINKING:-Disabled}
      # The commit-graph mirror sidecar (#504), reachable only over the internal coverage-git network. Unset turns the
      # graph off ("unavailable"). The rest of CommitGraph:* (budget, quotas, eviction) keeps its in-code placeholders.
      - CommitGraph__SidecarUrl=http://coverage-git:8080
      # The merge queue's git writer (M3), reachable only over the internal coverage-git-writer network. Unset turns the
      # merge queue's git steps off.
      - MergeQueue__GitWriterUrl=http://coverage-git-writer:8080
    volumes:
      # GitHub App private key, downloaded from the App settings page; see
      # .env.example for the expected location.
      - ./github-app.pem:/run/secrets/github-app.pem:ro
      # Its RavenDB client certificate and the CA. Not the operator's certificate, not SeoTester's.
      - ./raven-certs/codecoverage.crt:/run/secrets/raven/codecoverage.crt:ro
      - ./raven-certs/codecoverage.key:/run/secrets/raven/codecoverage.key:ro
      - ./raven-certs/ca.crt:/run/secrets/raven/ca.crt:ro
      # Survives `docker compose down` / image updates. Deleting this volume signs every user
      # out once and invalidates outstanding antiforgery tokens. ⚠️ It also protects the identity
      # provider's signing keys (OidcKeys documents, AI-agent sign-in, MCP plan M6): without it the
      # app refuses to start until those documents are deleted, after which every agent signs in
      # again. Back it up with the database (docs/code-coverage/hosting.md, "AI agents (MCP)").
      - dataprotection-keys:/var/lib/codecoverage/dataprotection-keys
    labels:
      - "traefik.enable=true"
      # Hardcoded like every other MintPlayer deployment: interpolating the
      # host from the server .env produced a non-matching router (empty/CRLF
      # value -> SNI never matches -> Traefik serves its default cert and
      # never requests one from Let's Encrypt).
      - "traefik.http.routers.coverage.rule=Host(`coverage.mintplayer.com`)"
      - "traefik.http.routers.coverage.entrypoints=websecure"
      - "traefik.http.routers.coverage.tls.certresolver=letsencrypt"
      # Pin the upstream port explicitly so Traefik never guesses.
      - "traefik.http.services.coverage.loadbalancer.server.port=8080"
      # The app sits on five networks; without this Traefik may resolve the
      # container's address on coverage-db, coverage-mail, coverage-git or coverage-git-writer, which it can't reach (random 504s).
      - "traefik.docker.network=web"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 8
      # ⚠️ Raised from 60s for the M6 re-key, which runs at startup and blocks before the app
      # listens. Measured on a restored production copy: ~80s to write the new ids across 224k
      # documents, ~20s to delete the legacy ones, plus 708 attachment moves. This VPS is a
      # shared-vCPU box, so the budget is deliberately several times the measured figure — the
      # failure this prevents is a container marked unhealthy while doing precisely what the
      # deploy asked of it, which reads as a broken release.
      #
      # It is a *start* period, not a timeout: a healthy app is marked healthy at the first
      # successful check, so an over-generous value costs nothing on an ordinary deploy where no
      # migration is pending.
      start_period: 600s
    networks:
      - web
      - coverage-db
      - coverage-mail
      # ⚠️ Shared with coverage-git ONLY (D4): the sidecar's API is unauthenticated, and this network is its boundary.
      - coverage-git
      # ⚠️ Shared with coverage-git-writer ONLY: the writer's API is unauthenticated and pushes, and this network is its boundary.
      - coverage-git-writer
    restart: unless-stopped

volumes:
  raven-data:
  dataprotection-keys:
  # Commit-graph mirrors (D8); mounted into coverage-git only. Deleting it costs re-clones on the next view, nothing else.
  codecoverage-git-data:
  # The git writer's job directories (M3); mounted into coverage-git-writer only. Empty between jobs.
  codecoverage-git-writer-jobs:

networks:
  web:
    external: true
  # Pairwise and internal (SeoTester PRD D55): each backend service is reachable only by the app that uses it, and no
  # network carries both RavenDB and the mail relay. internal: true = no route out; only coverage-git-egress and coverage-git-writer-egress have one.
  # tools/verify-backend-networks.test.mjs checks the members of each network across the stacks.
  #
  #   coverage-db           coverage-app, coverage-raven, coverage-raven-license
  #   coverage-mail         (external) coverage-app + the shared mail relay (apps/MailRelay)
  #   coverage-git         coverage-app, coverage-git (the commit-graph sidecar's unauthenticated API, #504 D4/D24)
  #   coverage-git-egress   coverage-git (its way to the forges, D18)
  #   coverage-git-writer         coverage-app, coverage-git-writer (the merge queue's unauthenticated writer API, M3)
  #   coverage-git-writer-egress  coverage-git-writer (its way to the forges)
  #   seo-raven  (external) coverage-raven + SeoTester's app
  #   mintplayer-raven  (external) coverage-raven + mintplayer.com's app
  coverage-db:
    driver: bridge
    internal: true
  # Shared with the mail relay, which is its own compose project: no project owns this network, and both deploys create
  # it, internal, when missing.
  coverage-mail:
    external: true
    name: coverage-mail
  # ⚠️ EXACTLY coverage-app and coverage-git (D4). The sidecar's API has no authentication: any other container added
  # here could read the private commit history of every mirrored repository, or delete and clone at will.
  coverage-git:
    driver: bridge
    internal: true
  # ⚠️ coverage-git ALONE (D18): its outbound route for clones. Nothing else may join it, or that container could
  # reach the sidecar's API from a network that is not internal.
  coverage-git-egress:
    driver: bridge
  # ⚠️ EXACTLY coverage-app and coverage-git-writer (M3). The writer's API has no authentication and pushes with the token
  # it is handed: any other container added here could have it push.
  coverage-git-writer:
    driver: bridge
    internal: true
  # ⚠️ coverage-git-writer ALONE: its outbound route for clones and pushes. Nothing else may join it.
  coverage-git-writer-egress:
    driver: bridge
  # Shared with SeoTester. They belong to no compose project, so neither stack's `down` removes them; both deploy
  # workflows create them, internal, when missing (`docker network create --internal seo-raven`).
  seo-raven:
    external: true
    name: seo-raven
  # Shared with mintplayer.com the same way (apps/MintPlayer/docker-compose.yml; both deploys create it).
  mintplayer-raven:
    external: true
    name: mintplayer-raven
