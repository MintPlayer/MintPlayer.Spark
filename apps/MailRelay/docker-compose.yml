# The outgoing mail relay shared by every app on the VPS: CodeCoverage (coverage.mintplayer.com), SeoTester
# (seotester.mintplayer.com) and mintplayer.com. Its own compose project in /var/www/mail-relay, deployed by
# .github/workflows/mail-relay-deploy.yml; it used to be the coverage-smtp service inside CodeCoverage's stack
# (docs/mintplayer_mail_plan.md, "Rename the relay"). Each app sends under its own sender domain, all through this one
# container and its one queue.
#
# Outgoing mail only. An app hands a message to this container and returns; the container queues it and does the
# delivering.
#
# ⚠️ Why a container rather than the app talking SMTP itself: the send happens INSIDE the external-login callback, while
# somebody is waiting on an HTTP response. A handoff one hop away takes milliseconds and succeeds whether or not the
# receiving mail server is reachable, and a queue that retries for days is the difference between "delivered late" and
# "the link was never sent". Putting an internet round-trip and its timeouts in the middle of a sign-in is the thing
# being avoided.
#
# ⚠️ It is NOT a mail server in the inbound sense. No ports are published, and the only containers that reach it are the
# apps, each on an internal network of its own with the relay (coverage-mail, seo-mail, mintplayer-mail) — which is also
# what makes running it without authentication safe. It never shares a network with RavenDB
# (tools/verify-backend-networks.test.mjs).
#
# The apps dial it as mail-relay:587 (each app's MAIL_HOST default).
services:
  mail-relay:
    image: boky/postfix:v4.3.0
    # A fixed name rather than mail-relay-mail-relay-1; the deploys look the container up by its compose labels.
    container_name: mail-relay
    environment:
      # Which envelope senders are accepted, space-separated: one domain per app. Anything else is refused rather than
      # relayed, so a bug cannot turn this into an open relay for another domain. Each domain needs a DKIM key below and
      # SPF + DKIM + DMARC records (docs/guide-outgoing-mail.md).
      - ALLOWED_SENDER_DOMAINS=${MAIL_SENDER_DOMAIN:-coverage.mintplayer.com seotester.mintplayer.com mail.mintplayer.com mintplayer.com}
      # Announced in HELO and used in Message-ID. ⚠️ Must match the server's reverse DNS or a good share of receivers will
      # refuse the mail outright. 188.245.190.60's PTR is coverage.mintplayer.com (Hetzner console, 2026-09-29); it is
      # one name per address, so it stays that name whichever app is sending.
      - HOSTNAME=${MAIL_HELO_HOSTNAME:-coverage.mintplayer.com}
      # Empty = deliver straight to each recipient's MX, which needs outbound port 25. Set it to a provider's submission
      # host to relay instead, which is the fallback if deliverability from this IP turns out to be poor.
      - RELAYHOST=${MAIL_RELAY_HOST:-}
      - RELAYHOST_USERNAME=${MAIL_RELAY_USERNAME:-}
      - RELAYHOST_PASSWORD=${MAIL_RELAY_PASSWORD:-}
      # The DKIM selector half of the DNS record (the same for every domain); the keys are mounted below.
      - DKIM_SELECTOR=${MAIL_DKIM_SELECTOR:-mail}
      # ⚠️ Send over IPv4 ONLY, never IPv6. Measured 2026-09-29, IPv6 fails on three counts:
      #   - the VPS sends from 2a01:4f8:c0c:f87c::1, but the SPF records name only IPv4 (and coverage.'s also only
      #     2a01:4f8:c0c:f87c::, i.e. ::0), so an IPv6 send fails SPF (-all);
      #   - that ::1 address has no PTR (Hetzner sets reverse DNS per address);
      #   - Gmail and Outlook refuse IPv6 senders without a matching PTR.
      # IPv4 is clean: 188.245.190.60's PTR matches HOSTNAME above and resolves back to the same address.
      # inet_protocols=ipv4 makes Postfix never try IPv6, not merely prefer IPv4 as smtp_address_preference did.
      - POSTFIX_inet_protocols=ipv4
      - POSTFIX_smtp_address_preference=ipv4
    volumes:
      # ⚠️ Close to mandatory. mintplayer.com publishes DMARC sp=reject, so mail from a subdomain that fails alignment is
      # REJECTED rather than junked, and without DKIM the whole thing rests on SPF — which breaks the moment a recipient
      # forwards the message. Both gotchas below were measured against this image, twice each:
      #
      #   1. The key must be FLAT: mail-dkim/<domain>.private. opendkim-genkey writes <domain>/<selector>.private, and
      #      the image silently logs "Skipping DKIM" and delivers UNSIGNED — which still succeeds on SPF, so the failure
      #      hides.
      #   2. It must be owned by opendkim (101:104 in v4.3.0) on the HOST. The image tries to chown what it cannot read,
      #      the read-only mount refuses, and the container then exits rather than starting unsigned.
      #
      # Verify with opendkim-testkey from a throwaway alpine container (README); inside this container its resolver
      # times out even for a good key (measured 2026-10-23). "key OK" only when the private key and the TXT agree.
      - ./mail-dkim:/etc/opendkim/keys:ro
      # Survives recreation, so a message queued during an outage is not lost when the relay is redeployed.
      - smtp-queue:/var/spool/postfix
    networks:
      # One internal network per app, shared with that app only. External: no compose project owns them, and every deploy
      # (this one and the app's) creates them, internal, when missing.
      - coverage-mail
      - seo-mail
      - mintplayer-mail
      # The relay's own way out (it delivers to recipients' MX on port 25). Nothing else joins it.
      - mail-relay-egress
    # bash, not sh: /dev/tcp is a bash feature, and this image's sh is dash, so the sh form failed on every probe and
    # marked a working relay "unhealthy" in production.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/587"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  smtp-queue:

networks:
  coverage-mail:
    external: true
    name: coverage-mail
  seo-mail:
    external: true
    name: seo-mail
  mintplayer-mail:
    external: true
    name: mintplayer-mail
  mail-relay-egress:
    driver: bridge
