<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spark SQL demo</title>
  <base href="/">
  <!-- Colour mode (#462): the default-mode meta precedes the pre-boot script, which reads it synchronously, and the
       script precedes every stylesheet, so the first paint is already themed (as in the other demos). -->
  <meta name="color-scheme" content="light dark">
  <meta name="bs-theme-default-mode" content="auto">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2b3035">
  <script src="bs-theme-preboot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to use the Spark SQL demo.</noscript>
</body>
</html>
