# schemas.spark.mintplayer.com (#264, G-Q9): the published Spark JSON schemas, one folder per
# revision, at /v{n}/<file>.schema.json.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Readiness for the deploy's probe; answers without touching the files.
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # A revision never changes once published (the publish workflow only ever adds v{n+1}), so it
    # is cached for a year and marked immutable. CORS is open: editors and validators fetch a schema
    # from whatever origin the file being edited lives on.
    #
    # ⚠️ add_header is not inherited by a location that has an add_header of its own, so every
    # location repeats the CORS header.
    location ~ "^/v[0-9]+/[A-Za-z]+\.schema\.json$" {
        types { }
        default_type application/schema+json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The listing of revisions and files, for people. Not cached: it grows with every revision.
    location / {
        autoindex on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
}
