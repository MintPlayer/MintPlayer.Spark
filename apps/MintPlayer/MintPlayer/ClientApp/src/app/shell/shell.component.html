<spark-shell title="MintPlayer">
  <!-- The menu is server-driven (App_Data/programUnits.json): Music, Playlists and Catalog. -->
  <ng-container *sparkShellTopbarEnd>
    <!-- Searches artists, people and songs (docs/spark_search_PRD.md); Enter on a name opens it. -->
    <spark-site-search class="me-2" />
    <spark-language-selector />
    <spark-auth-bar />
    <app-queue-toggler />
  </ng-container>
  <router-outlet />
</spark-shell>
<app-player-dock />
