<spark-shell title="SeoTester">
  <!-- The menu is server-driven: Organizations, Notifications and (administrators only) Settings come with their
       packages. The topbar adds the organization switcher (lists follow it, Q-M11a), the notification bell (live
       unread count, push opt-in) and the account pages. -->
  <ng-container *sparkShellTopbarEnd>
    <spark-language-selector />
    @if (auth.isAuthenticated()) {
      <spark-organization-switcher />
      <spark-notification-bell />
    }
    <!-- How to connect an AI agent to /mcp, for everyone: drawn like the auth bar's login button beside it. -->
    <a class="btn btn-sm topbar-btn text-nowrap" routerLink="/connect-agent" [title]="'mcpUi.title' | t" data-connect-agent-link>
      <i class="bi bi-robot"></i><span class="d-none d-sm-inline"> {{ 'mcpUi.navLink' | t }}</span>
    </a>
    <spark-auth-bar />
  </ng-container>
  <router-outlet />
  <!-- Under every page, the sign-in page included (D47). Connect an AI agent is this app's page (a route); the rest are
       plain links: these are the server's pages (Legal/, Bot/), not
       routes, and the service worker leaves them to the server (ngsw-config.json). -->
  <footer class="small text-center text-body-secondary my-4" data-legal-links>
    <a routerLink="/connect-agent" data-connect-agent-link>{{ 'mcpUi.navLink' | t }}</a> · <a href="/privacy">{{ 'app.privacy' | t }}</a> · <a href="/terms">{{ 'app.terms' | t }}</a> · <a href="/bot">{{ 'app.aboutTheCrawler' | t }}</a>
  </footer>
</spark-shell>
