services:

  spark-raven:
    # Pinned (not 7.1-latest): the floating tag silently advanced to a build
    # that rejects unsecured access on a 0.0.0.0 bind, breaking deploys on a
    # plain `docker compose pull`. 7.1-latest resolves to the Ubuntu x64 image.
    image: docker.io/ravendb/ravendb:7.1.10-ubuntu.22.04-x64
    environment:
      - RAVEN_Setup_Mode=None
      # R2-L1: Raven binds to 0.0.0.0 (it has no fixed private IP on the Docker
      # bridge), and RavenDB only permits unsecured access on a 0.0.0.0 bind
      # when UnsecuredAccessAllowed=PublicNetwork — PrivateNetwork is rejected
      # at startup ("potentially unsafe mode"). What actually keeps Raven off
      # the public internet is the network topology, not this flag: spark-raven
      # publishes no host ports and lives only on the spark-internal network
      # below, never on the public 'web' Traefik network.
      - RAVEN_Security_UnsecuredAccessAllowed=PublicNetwork
      - RAVEN_ServerUrl=http://0.0.0.0:8080
      # No licence settings here: on ravendb 7.1.10 a licence supplied through
      # configuration (RAVEN_License, RAVEN_License_Path, RAVEN_ARGS,
      # RAVEN_SETTINGS, settings.json) is silently ignored. The spark-raven-license
      # service below applies it through the activation endpoint instead.
    volumes:
      # ravendb:7.1-latest sets RAVEN_DataDir=/var/lib/ravendb/data; mounting the
      # legacy /opt/RavenDB/Server/RavenData path silently lost data on every
      # container recreate.
      - raven-data:/var/lib/ravendb/data
    networks:
      - spark-internal
    restart: unless-stopped

  # One-shot licence activation; see apps/CodeCoverage/README.md "RavenDB licence"
  # for why this is a POST rather than a setting. Drop the licence JSON next to
  # this file as raven-license.json (gitignored); without it this container exits
  # non-zero and the demo runs AGPL/restricted, as it always has.
  spark-raven-license:
    image: curlimages/curl:8.11.1
    depends_on:
      - spark-raven
    volumes:
      - ./raven-license.json:/raven-license.json:ro
    networks:
      - spark-internal
    # spark-raven has no healthcheck to wait on, so retry through its startup.
    command:
      - "-sS"
      - "-f"
      - "--retry"
      - "20"
      - "--retry-delay"
      - "3"
      - "--retry-connrefused"
      - "-X"
      - "POST"
      - "-H"
      - "Content-Type: application/json"
      - "--data-binary"
      - "@/raven-license.json"
      - "http://spark-raven:8080/admin/license/activate"
    restart: "no"

  spark-app:
    image: ghcr.io/mintplayer/mintplayer.spark/webhooks-demo:master
    depends_on:
      - spark-raven
    environment:
      - Spark__RavenDB__Urls__0=http://spark-raven:8080
      - Spark__RavenDb__EnsureDatabaseCreated=true
      - GitHub__WebhookSecret=${GITHUB_WEBHOOK_SECRET}
      - GitHub__Production__AppId=${GITHUB_PRODUCTION_APP_ID}
      - GitHub__Production__ClientId=${GITHUB_APP_CLIENT_ID}
      - GitHub__Production__ClientSecret=${GITHUB_APP_CLIENT_SECRET}
      - GitHub__Production__PrivateKeyPath=/run/secrets/github-app.pem
      - GitHub__Development__AppId=${GITHUB_DEVELOPMENT_APP_ID}
    volumes:
      - ./github-app.pem:/run/secrets/github-app.pem:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spark-webhooks.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.spark-webhooks.entrypoints=websecure"
      - "traefik.http.routers.spark-webhooks.tls.certresolver=letsencrypt"
    networks:
      - web
      - spark-internal
    restart: unless-stopped

volumes:
  raven-data:

networks:
  web:
    external: true
  # R2-L1: dedicated internal network for app↔Raven traffic. Raven sits on
  # this network only; the public Traefik network never reaches port 8080.
  spark-internal:
    driver: bridge
