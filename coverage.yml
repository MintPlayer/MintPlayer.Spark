# CodeCoverage's in-repository policy (coverage.mintplayer.com).
#
# `mergeQueue:` is read from the DEFAULT branch only (docs/coverage_merge_queue_PRD.md O16), so a pull
# request cannot widen it for itself. Trust settings (approval floor, check exclusions) are not here: they
# live on the organization/repository pages (O15).
mergeQueue:
  enabled: true
  # supported-lines: every branch versioning.lines' pattern matches (release/dotnet-11.x, release/angular-22.x), so
  # backport pull requests go through the queue too (docs/coverage_backport_PRD.md D12).
  branches: [master, supported-lines]
  mergeMethod: squash
  enqueue:
    label: merge-queue
  # .github/workflows/regenerate.yml: builds every app and runs synchronize, returning a patch artifact.
  postRebaseActionName: regenerate.yml
  postRebaseTimeout: 20m
  postRebaseWhen: auto-resolved
  # The only paths the regenerate patch may touch (T4), besides each file a keepBothDefaults rule resolved for the
  # entry (never the default's glob, O37). Synchronize writes nothing else. This list replaces the default one.
  regeneratedPaths:
    - "**/App_Data/modelHashes.json"
    - "**/App_Data/securityPosture.txt"
    - "**/App_Data/translations.json"
    - "**/App_Data/security.json"
    - "**/App_Data/Model/*.json"
    # The layering goldens, rewritten by regenerate.yml's after-synchronize step (SPARK_UPDATE_GOLDEN=1).
    - "tests/MintPlayer.Spark.Tests/Layering/Golden/*.golden.txt"
  # take-base for the wholly generated files (O1, O19): a conflict anywhere in them takes the base side and
  # the regenerate step rewrites them. These explicit rules come first; after them, keepBothDefaults (on
  # unless set to false, O35/O36) adds keep-both for **/*.json (json-no-duplicate-keys), ignore files,
  # CHANGELOG.md and XML project files: both sides' insertions at one place are kept, the result must
  # validate, and regenerate.yml re-sorts what synchronize owns. Any other conflict evicts the pull request.
  autoResolve:
    - path: "**/App_Data/modelHashes.json"
      strategy: take-base
    - path: "**/App_Data/securityPosture.txt"
      strategy: take-base
    - path: "tests/MintPlayer.Spark.Tests/Layering/Golden/*.golden.txt"
      strategy: take-base

# Package versions (#153, docs/coverage_package_versioning_PRD.md D2): the versioning action in
# dotnet-build-master.yml runs the engine on the runner, never against coverage.mintplayer.com, because that
# workflow is what deploys the app. Read from the DEFAULT branch only, like mergeQueue:.
versioning:
  mode: local
  # Test fixtures hold ~50 csproj/package.json files that are not packages; matching project files stay out of the
  # graph and matching changes release nothing. Not **/*.md: a package's README ships inside it.
  ignore:
    - "**/fixtures/**"
    - "**/Fixtures/**"
  # Spark is in preview, so every package releases as -preview.N whatever it ships against (an Octokit.GraphQL beta,
  # an Endpoints rc). Remove this line when Spark goes stable. The two exemptions are already stable: ng-spark is a
  # 22.x Angular package, and the onboarding PRs reference MintPlayer.Versioning.MSBuild 1.0.0.
  prerelease: preview
  packages:
    "@mintplayer/ng-spark": { prerelease: upstream }
    MintPlayer.Versioning.MSBuild: { prerelease: upstream }
  # Release lines (#568 D15): packages release only from release/{ecosystem}-{major}.x, never from master. A change
  # ships once its pull request is backported onto a line (D16: the current line is always labelled). Lines today:
  # release/dotnet-11.x and release/angular-22.x. The past lines (dotnet-10.x, angular-21.x) are cut only when a fix
  # must ship there, because their cut points predate tag versioning (#568 M11, owner 2026-11-06).
  lines: {}
