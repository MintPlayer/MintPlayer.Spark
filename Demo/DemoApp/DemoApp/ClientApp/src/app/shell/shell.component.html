<bs-shell [state]="shellState()" [breakpoint]="'md'" (statechange)="onShellToggle($event)">
  <div *bsShellTopbar class="w-100 bg-dark d-flex align-items-center">
    <bs-navbar-toggler [state]="isSidebarVisible()"
                       (stateChange)="toggleSidebar($event)">
    </bs-navbar-toggler>
  </div>
  <nav bsShellSidebar data-bs-theme="dark" class="sidebar-inner text-light p-2">
    <h5 class="p-3 border-bottom">Spark Demo</h5>
    <bs-accordion class="d-block">
      @for (group of programUnitGroups(); track group.id) {
      <bs-accordion-tab>
        <ng-container *bsAccordionTabHeader>
          <span class="triangle me-2"></span>
          <spark-icon [name]="group.icon | iconName:'bi-folder'" />
          <span class="ms-2">{{ group.name | resolveTranslation }}</span>
        </ng-container>
        @for (unit of group.programUnits; track unit.id) {
        <a [routerLink]="unit | routerLink"
           routerLinkActive="active"
           (click)="onMenuItemClick()"
           class="d-block px-3 py-2 text-light text-decoration-none nav-link">
          <spark-icon [name]="unit.icon | iconName:'bi-file'" />
          <span class="ms-2">{{ unit.name | resolveTranslation }}</span>
        </a>
        }
      </bs-accordion-tab>
      }

      <!-- Hand-written, unlike the groups above: the menu is built from the server's program
           units, and this page demonstrates a CLIENT-side API (the spark-query-card slots)
           that nothing in the model describes. Kept inside the accordion and using the same
           markup as a generated item so it picks up the sidebar's styling rather than
           needing its own. -->
      <bs-accordion-tab>
        <ng-container *bsAccordionTabHeader>
          <span class="triangle me-2"></span>
          <spark-icon name="palette" />
          <span class="ms-2">Component demos</span>
        </ng-container>
        <a routerLink="/query-slots"
           routerLinkActive="active"
           (click)="onMenuItemClick()"
           class="d-block px-3 py-2 text-light text-decoration-none nav-link">
          <spark-icon name="grid-3x3-gap" />
          <span class="ms-2">Query card slots</span>
        </a>
      </bs-accordion-tab>
    </bs-accordion>
  </nav>

  <main class="p-4">
    <router-outlet />
  </main>
</bs-shell>
