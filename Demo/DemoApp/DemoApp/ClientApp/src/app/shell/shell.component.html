<spark-shell title="Spark Demo">
  <!-- Hand-written, unlike the menu: the /query-slots page demonstrates a CLIENT-side API (the
       spark-query-card slots) that nothing in the model describes, so it can't be a program
       unit. The whole accordion is declared inside the slot template — an accordion tab and its
       accordion must be declared together for tab discovery to work across the boundary. -->
  <ng-container *sparkShellSidebarTabs>
    <bs-accordion class="d-block">
      <bs-accordion-tab>
        <ng-container *bsAccordionTabHeader>
          <spark-icon name="palette" />
          <span class="ms-2">Component demos</span>
        </ng-container>
        <a routerLink="/query-slots"
           routerLinkActive="active"
           class="d-block px-3 py-2 text-decoration-none nav-link">
          <spark-icon name="grid-3x3-gap" />
          <span class="ms-2">Query card slots</span>
        </a>
      </bs-accordion-tab>
    </bs-accordion>
  </ng-container>
  <router-outlet />
</spark-shell>
