<spark-shell>
  <ng-container *sparkShellTopbarEnd>
    <spark-language-selector />
    @if (authService.user()?.isAuthenticated) {
      <span class="text-light">{{ authService.user()?.userName }}</span>
      <button class="btn btn-outline-light btn-sm" (click)="logout()">{{ 'auth.logout' | t }}</button>
    } @else {
      <!-- Routes to the sign-in landing page rather than calling loginWithProvider('GitHub')
           directly. The scheme literal was #303: it silently stops matching the moment the
           server's provider registration changes, and nothing fails loudly when it does. -->
      <a routerLink="/sign-in" [queryParams]="{ returnUrl: '/github-projects' }"
         class="btn btn-outline-light btn-sm">{{ 'auth.login' | t }}</a>
    }
  </ng-container>

  <h5 *sparkShellSidebarHeader class="p-3 border-bottom">{{ 'app.webhooksDemo' | t }}</h5>

  <!-- App-specific page outside the model (GitHub projects board), so not a program unit. -->
  <ng-container *sparkShellSidebarTop>
    @if (authService.user()?.isAuthenticated) {
      <a routerLink="/github-projects"
         routerLinkActive="active"
         class="d-block px-3 py-2 text-decoration-none nav-link">
        <i class="bi bi-kanban"></i>
        <span class="ms-2">{{ 'app.githubProjects' | t }}</span>
      </a>
      <hr class="border-secondary my-1">
    }
  </ng-container>

  <router-outlet />
</spark-shell>
