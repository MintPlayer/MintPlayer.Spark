<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SparkApp</title>
  <base href="/">
  <!-- Colour mode: the default-mode meta must precede the pre-boot script, which reads it synchronously. The script
       must follow <base> and precede every stylesheet, so the first paint is already themed. -->
  <meta name="color-scheme" content="light dark">
  <meta name="bs-theme-default-mode" content="auto">
  <script src="bs-theme-preboot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to use SparkApp.</noscript>
</body>
</html>
