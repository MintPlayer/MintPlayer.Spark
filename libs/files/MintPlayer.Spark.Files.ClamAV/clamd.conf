# clamd.conf for MintPlayer.Spark.Files.ClamAV (#700, PRD SP4), for the clamav/clamav-debian image.
# Mount it read-only over /etc/clamav/clamd.conf. The first five lines are the image's own defaults.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Fail-closed limits. Without AlertExceedsMax, a small archive hides an over-limit payload behind an OK (SP4):
# with it, clamd answers Heuristics.Limits.Exceeded.* FOUND, which the client refuses.
AlertExceedsMax yes

# The upload itself. Keep StreamMaxLength >= the client's MaxStreamLength >= Spark:Files:MaxFileBytes. Above it
# clamd drops the connection instead of answering; the client refuses such a file before sending it.
StreamMaxLength 25M

# What clamd unpacks from an archive. Keep MaxFileSize >= MaxScanSize. ClamAV 1.5 does not skip an archive member
# over MaxFileSize: it trims it to MaxFileSize, scans the start, and alerts on nothing. Only the MaxScanSize total
# alerts. With MaxFileSize at 25M, a zip holding a 150 MiB member scanned OK; at 100M (= MaxScanSize) it is
# Heuristics.Limits.Exceeded.MaxScanSize FOUND (measured 2026-11-22, PRD section 10 M7).
MaxFileSize 100M
MaxScanSize 100M
