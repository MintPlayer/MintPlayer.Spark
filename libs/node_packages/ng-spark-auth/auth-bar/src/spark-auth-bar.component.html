@if (authService.isAuthenticated()) {
  <!-- No user name here: an email address does not fit a topbar. The account page shows it, and
       the account page is also where passkeys, two-factor and the rest live when they are mounted. -->
  <bs-button-group>
    @if (accountUrl) {
      <a class="btn btn-sm spark-auth-bar-btn text-nowrap" [routerLink]="accountUrl"
         [attr.title]="authService.user()?.userName">{{ 'auth.account' | t }}</a>
    }
    <button type="button" class="btn btn-sm spark-auth-bar-btn text-nowrap" (click)="onLogout()">{{ 'auth.logout' | t }}</button>
  </bs-button-group>
} @else {
  <a class="btn btn-sm spark-auth-bar-btn text-nowrap" [routerLink]="signInUrl">{{ 'auth.login' | t }}</a>
}
