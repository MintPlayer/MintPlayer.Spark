@if (authService.isAuthenticated()) {
  <span class="me-2">{{ authService.user()?.userName }}</span>
  @if (showPasskeys()) {
    <a class="btn btn-sm spark-auth-bar-btn me-2" [routerLink]="passkeysUrl">{{ 'auth.passkeysTitle' | t }}</a>
  }
  <button class="btn btn-sm spark-auth-bar-btn" (click)="onLogout()">{{ 'auth.logout' | t }}</button>
} @else {
  <a class="btn btn-sm spark-auth-bar-btn" [routerLink]="signInUrl">{{ 'auth.login' | t }}</a>
}
