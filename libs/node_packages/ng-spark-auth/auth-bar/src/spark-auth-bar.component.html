@if (authService.isAuthenticated()) {
  <!-- Hidden below sm: at phone width the name pushed the buttons onto a second line, out of the
       topbar. On wider screens it truncates rather than wrapping. -->
  <span class="spark-auth-bar-user d-none d-sm-inline-block text-truncate me-2"
        [attr.title]="authService.user()?.userName">{{ authService.user()?.userName }}</span>
  @if (showPasskeys()) {
    <a class="btn btn-sm spark-auth-bar-btn text-nowrap me-2" [routerLink]="passkeysUrl">{{ 'auth.passkeysTitle' | t }}</a>
  }
  <button class="btn btn-sm spark-auth-bar-btn text-nowrap" (click)="onLogout()">{{ 'auth.logout' | t }}</button>
} @else {
  <a class="btn btn-sm spark-auth-bar-btn text-nowrap" [routerLink]="signInUrl">{{ 'auth.login' | t }}</a>
}
