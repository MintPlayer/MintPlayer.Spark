<bs-grid>
  @if (entityType(); as et) {
    <h2 class="mb-4">{{ 'common.create' | t }} {{ (et.label | resolveTranslation) || et.name }}</h2>

    @for (error of generalErrors(); track error.errorMessage) {
      <bs-alert [color]="'danger'" class="mb-3">
        {{ error.errorMessage | resolveTranslation }}
      </bs-alert>
    }

    <spark-po-form
      [entityType]="et"
      [(formData)]="formData"
      [(refreshOverlay)]="refreshOverlay"
      [objectTypeId]="type()"
      [parentType]="type()"
      [referenceParentId]="subQueryParent()?.parentId"
      [referenceParentType]="subQueryParent()?.parentType"
      [validationErrors]="validationErrors()"
      [showButtons]="true"
      [isSaving]="isSaving()"
      (save)="onSave()"
      (cancel)="onCancel()">
    </spark-po-form>
  } @else {
    <div class="text-center p-5">
      <bs-spinner />
    </div>
  }
</bs-grid>
