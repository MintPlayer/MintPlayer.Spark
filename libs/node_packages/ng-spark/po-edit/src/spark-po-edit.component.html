<bs-container>
<div class="container">
  @for (error of generalErrors(); track error.errorMessage) {
    <bs-alert [type]="colors.danger" class="mb-3">
      {{ error.errorMessage | resolveTranslation }}
    </bs-alert>
  }

  @if (conflictNotice(); as notice) {
    <bs-alert [type]="colors.info" class="mb-3 spark-conflict-notice">
      {{ notice }}
    </bs-alert>
  }

  <spark-po-conflict-dialog
    [conflicts]="pendingConflicts()"
    [referenceLabels]="conflictReferenceLabels()"
    [audit]="conflictAudit()"
    [theyChanged]="theyChanged()"
    (resolved)="onConflictResolved($event)"
    (cancelled)="onConflictCancelled()" />

  @if (entityType(); as et) {
    @if (item()) {
    <h2 class="mb-4">{{ 'common.edit' | t }} {{ (et.label | resolveTranslation) || et.name }}</h2>

    <spark-po-form
      [entityType]="formEntityType() ?? et"
      [(formData)]="formData"
      [(refreshOverlay)]="refreshOverlay"
      [objectTypeId]="type"
      [objectId]="id"
      [validationErrors]="validationErrors()"
      [showButtons]="true"
      [isSaving]="isSaving()"
      [parentId]="id"
      [parentType]="type"
      (save)="onSave()"
      (cancel)="onCancel()">
    </spark-po-form>
    }
  } @else {
    <div class="text-center p-5">
      <bs-spinner />
    </div>
  }
</div>
</bs-container>
