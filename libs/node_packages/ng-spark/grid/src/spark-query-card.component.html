<!--
  The card is always rendered. A host that wants no card uses <spark-query-grid> directly — which
  is what the old `showCard="false"` meant, expressed as a component choice rather than a flag.
-->
<bs-card class="d-block my-3">
  <bs-card-header>
    <div class="d-flex align-items-center gap-2">
      @if (iconTpl(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: query() }"></ng-container>
      }

      @if (actionsTpl(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: customActions(), selection: selection(), query: query() }"></ng-container>
      } @else if (customActions().length) {
        <!-- The default: the actions the server declares for this type. The nav renders only when
             there are any, so a query without actions is pixel-identical to a plain caption.

             Disabled, not hidden: hiding makes the affordance undiscoverable and reflows the
             priority nav on every selection change. The server enforces the same rule. -->
        <bs-priority-nav [moreLabel]="lang.t('common.more')" [collapseAt]="'sm'">
          @for (action of customActions(); track action.name) {
            <button *bsPriorityNavItem="10 + action.offset" class="btn btn-sm btn-outline-primary"
                    [disabled]="!grid()?.isActionEnabled(action)" (click)="grid()?.onCustomAction(action)">
              {{ action.displayName | resolveTranslation }}
            </button>
          }
        </bs-priority-nav>
      }

      <!--
        Caption last, actions first. The auto margin is conditional rather than fixed, and that is
        the point: with actions present `ms-auto` pushes the caption to the trailing edge, and with
        none it falls back to `me-auto` so a plain card looks exactly as it always did. A fixed
        `ms-auto` would have right-aligned the caption of every action-less query card in every app
        — a change nobody asked for, to fix a layout only some cards have.
      -->
      <span [class.ms-auto]="customActions().length" [class.me-auto]="!customActions().length">
        @if (captionTpl(); as tpl) {
          <ng-container *ngTemplateOutlet="tpl; context: { $implicit: caption(), query: query() }"></ng-container>
        } @else {
          {{ caption() }}
        }
      </span>
    </div>
  </bs-card-header>

  <div class="p-3">
    <spark-query-grid
        [queryId]="queryId()"
        [parentId]="parentId()"
        [parentType]="parentType()"
        [reloadToken]="reloadToken()"
        [data]="data()"
        [search]="search()"
        (error)="error.emit($event)"
        (rowClicked)="rowClicked.emit($event)"
        (customActionExecuted)="customActionExecuted.emit($event)" />
  </div>
</bs-card>
