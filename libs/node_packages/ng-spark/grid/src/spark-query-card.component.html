<!--
  The card is always rendered. A host that wants no card uses <spark-query-grid> directly — which
  is what the old `showCard="false"` meant, expressed as a component choice rather than a flag.
-->
<bs-card class="d-block my-3">
  <bs-card-header>
    <div class="d-flex align-items-center gap-2">
      @if (iconTpl(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: query() }"></ng-container>
      }

      <!--
        Caption first, actions on the trailing edge (#460 M15, as query-grid-card-PRD.md always said,
        and as Vidyano's sub-query tabs do). `me-auto` on the caption pushes the actions right; a card
        without actions looks exactly as a plain caption did.
      -->
      <span class="me-auto spark-query-card-caption">
        @if (captionTpl(); as tpl) {
          <ng-container *ngTemplateOutlet="tpl; context: { $implicit: caption(), query: query() }"></ng-container>
        } @else {
          {{ caption() }}
        }
      </span>

      @if (actionsTpl(); as tpl) {
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: customActions(), actions: toolbarActions(), selection: selection(), query: query() }"></ng-container>
      } @else if (toolbarActions().length) {
        <!-- The default: New, Delete and the custom actions the server offers this caller, with the
             overflow in the priority nav's "…". The nav renders only when there are any.

             Disabled, not hidden: hiding makes the affordance undiscoverable and reflows the
             priority nav on every selection change. The server enforces the same rules. -->
        <bs-priority-nav class="spark-query-card-actions" [moreLabel]="'…'" [collapseAt]="'sm'">
          @for (action of toolbarActions(); track action.name) {
            <button *bsPriorityNavItem="action.priority" type="button" [class]="actionClass(action)"
                    [attr.data-action]="action.name"
                    [disabled]="!isEnabled(action)" (click)="run(action)">
              @if (action.definition.icon && action.kind !== 'custom') {
                <spark-icon [name]="action.definition.icon" />
              }
              {{ action.definition.displayName | resolveTranslation }}
            </button>
          }
        </bs-priority-nav>
      }
    </div>
  </bs-card-header>

  <div class="p-3">
    <spark-query-grid
        [queryId]="queryId()"
        [parentId]="parentId()"
        [parentType]="parentType()"
        [reloadToken]="reloadToken()"
        [data]="data()"
        [search]="search()"
        [rowRoute]="rowRoute()"
        [selectionModeSetting]="selectionMode()"
        (error)="error.emit($event)"
        (rowClicked)="rowClicked.emit($event)"
        (customActionExecuted)="customActionExecuted.emit($event)" />
  </div>
</bs-card>
