<div class="spark-filter-panel">
  <!--
    Clear sits first and is disabled when there is nothing to clear, matching the panel this
    follows. It is a real <button> so it is reachable by keyboard inside the datatable's focus trap.
  -->
  <button type="button" class="spark-filter-clear" [disabled]="!hasSelection()" (click)="clear()">
    <spark-icon name="funnel" />
    <span>Clear filter</span>
  </button>

  @if (listsDistincts()) {
    <div class="spark-filter-search">
      <spark-icon name="search" />
      <input
        type="text"
        [attr.aria-label]="'Search values'"
        (input)="onSearch($any($event.target).value)" />
    </div>

    <div class="spark-filter-body">
      <!--
        The inverse toggle is a pressed-state button rather than a checkbox: it does not select a
        value, it changes what the selection means. aria-pressed is written for both states so a
        screen reader announces the off state too.
      -->
      <button
        type="button"
        class="spark-filter-inverse"
        [class.is-on]="inverse()"
        [attr.aria-pressed]="inverse()"
        (click)="toggleInverse()">
        ≠
      </button>

      <div class="spark-filter-values" role="group" [attr.aria-label]="'Values'">
        @for (value of matching(); track value.value) {
          <label class="spark-filter-value">
            <input
              type="checkbox"
              [checked]="isChecked(value)"
              (change)="toggle(value, $any($event.target).checked)" />
            <span>{{ labelFor(value) }}</span>
          </label>
        }

        <!--
          Values that were present when the filter was first applied but are not any more. Dimmed
          and still selectable, so a selection can be widened without clearing it first. The
          datatable derives this bucket itself by diffing its snapshot; the server always sends it
          empty.
        -->
        @for (value of remaining(); track value.value) {
          <label class="spark-filter-value is-remaining">
            <input
              type="checkbox"
              [checked]="isChecked(value)"
              (change)="toggle(value, $any($event.target).checked)" />
            <span>{{ labelFor(value) }}</span>
          </label>
        }

        @if (!matching().length && !remaining().length) {
          <p class="spark-filter-empty">No values</p>
        }
      </div>
    </div>

    @if (hasMore()) {
      <!--
        Text, not an icon: a truncated list is a fact the reader needs in words, and it is the only
        signal that typing will fetch more.
      -->
      <p class="spark-filter-more">Showing the first values only — type to narrow.</p>
    }
  } @else {
    <!--
      A column whose values may not be enumerated. Free text instead of a list, applied through the
      same `apply` so the grid has one event shape to translate.
    -->
    <div class="spark-filter-search">
      <spark-icon name="search" />
      <input
        type="text"
        [value]="freeText()"
        [attr.aria-label]="'Filter value'"
        (input)="freeText.set($any($event.target).value)"
        (keydown.enter)="applyFreeText()" />
    </div>
    <button type="button" class="spark-filter-apply" (click)="applyFreeText()">Apply</button>
  }
</div>
