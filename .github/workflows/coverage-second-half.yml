# Manual probe for the coverage server's commit assembly: uploads ONE library's
# coverage for an arbitrary commit as a separate workflow run, so that commit
# ends up with two builds (this one and the PR/master run's). The server must
# union them — the commit headline is the assembly of every finalized build, not
# whichever finalized last (docs/coverage_carryforward_PRD.md §5.4, exit
# criterion 2). Dispatch it against a PR head after that PR's run finished, then
# check `assembly.builds` in GET /api/uploads/status (or the commit page) lists
# both runs and the number is the union.
#
# Never scheduled, never triggered by pushes: this exists to be run by hand when
# verifying a server deploy, and its result is read by a human.
name: coverage-second-half (manual probe)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit sha (or branch) to upload for — use a PR head that already has a coverage build.'
        required: true
      base-sha:
        description: 'The base the affected computation would have used (the PR merge-base). Empty = let the server resolve it.'
        required: false
        default: ''
      project:
        description: 'Nx project whose tests to run and upload.'
        required: true
        default: '@mintplayer/ng-spark-auth'

permissions:
  contents: read

jobs:
  second-half:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        # Full history: the action reads the commit's first parent and the
        # tracked tree with blob OIDs from the checkout.
        fetch-depth: 0

    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm

    - run: npm ci

    - name: Test one project
      id: test
      run: npx nx run ${{ inputs.project }}:test --skip-nx-cache

    - name: Upload as a second build of the same commit
      if: always()
      uses: ./apps/CodeCoverage/action
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: libs/node_packages/*/coverage/cobertura-coverage.xml
        disable-search: true
        partial: true
        base-sha: ${{ inputs.base-sha }}
        carry-forward: ${{ steps.test.outcome == 'success' }}
        name: second-half
        finish: true
        wait-for-finalize: true
        fail-ci-if-error: true
