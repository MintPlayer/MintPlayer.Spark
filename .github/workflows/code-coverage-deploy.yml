name: code-coverage-deploy

# Deploys apps/CodeCoverage to coverage.mintplayer.com.
#
# The image name is deliberately UNCHANGED from when this app lived in
# MintPlayer/CodeCoverage: ghcr.io/mintplayer/codecoverage. The VPS pulls that name from a
# server-managed docker-compose.yml, so keeping it means the running server needs no manual
# intervention for the repository move. Renaming it would require an operator to edit the compose
# file and re-login before the next deploy could land.

on:
  push:
    branches:
      - master
    paths:
      - 'apps/CodeCoverage/**'
      # The upload action lives here but is not part of the server image: it is
      # consumed by consumers from a git ref, and `coverage-action.yml` rebuilds
      # and republishes its bundle. Without this exclusion every action-only
      # commit would build an image and SSH-deploy the VPS for a change the image
      # does not contain. The old standalone repo guarded the same way
      # (`paths-ignore: ['action/**']` in its publish.yml).
      - '!apps/CodeCoverage/action/**'
      # CodeCoverage's transitive ProjectReference closure. Hand-maintained: if the app takes a new
      # Spark dependency, add it here or a change to that library will not trigger a deploy.
      - 'libs/spark/MintPlayer.Spark/**'
      - 'libs/spark/MintPlayer.Spark.Abstractions/**'
      - 'libs/authorization/MintPlayer.Spark.Authorization/**'
      - 'libs/controllers/MintPlayer.Spark.Controllers/**'
      - 'libs/cron/MintPlayer.Spark.Cron/**'
      - 'libs/messaging/MintPlayer.Spark.Messaging/**'
      - 'libs/messaging/MintPlayer.Spark.Messaging.Abstractions/**'
      - 'libs/migrations/MintPlayer.Spark.Migrations/**'
      - 'libs/webhooks/MintPlayer.Spark.Webhooks.GitHub/**'
      - 'libs/webhooks/MintPlayer.Spark.Webhooks.GitHub.DevTunnel/**'
      - 'libs/subscription_worker/MintPlayer.Spark.SubscriptionWorker.Abstractions/**'
      - 'libs/source_generators/MintPlayer.Spark.SourceGenerators/**'
      - 'libs/socket_extensions/MintPlayer.Dotnet.SocketExtensions/**'
      # Angular libraries baked into the image via `nx run @spark-apps/code-coverage:build`.
      - 'libs/node_packages/ng-spark/**'
      - 'libs/node_packages/ng-spark-auth/**'
      # Workspace-level files that affect the build.
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mintplayer/codecoverage
  APP_NAME: code-coverage
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}

jobs:
  build-and-push:

    name: Build and push Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # No host .NET/Node setup: the Dockerfile's build stage runs dotnet restore, npm ci,
    # nx run @spark-apps/code-coverage:build and dotnet build/publish inside the container.
    # Build failures are already gated by pull-request.yml pre-merge.
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Authenticate with GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract tags/labels
      id: meta-ghcr
      uses: docker/metadata-action@v6
      with:
        github-token: ${{ github.token }}
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    # No Nx remote-cache credentials are passed into the build by design: the Dockerfile uses
    # --skip-nx-cache so the deployed image is always rebuilt from the build context, never
    # replayed from a cache entry. See docs/guide-nx-remote-cache.md.
    - name: Build and push Docker image
      id: push-ghcr
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./apps/CodeCoverage/CodeCoverage/Dockerfile
        push: true
        tags: ${{ steps.meta-ghcr.outputs.tags }}
        labels: ${{ steps.meta-ghcr.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.push-ghcr.outputs.digest }}
        push-to-registry: true

    # Best-effort: the package must be public for the VPS to pull without credentials. Needs a token
    # with the packages scope, which github.token may not carry — verify in the package settings
    # after the first run rather than trusting this step.
    - name: Make the package public
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method PATCH -H "Accept: application/vnd.github+json" \
          "/orgs/${{ github.repository_owner }}/packages/container/codecoverage" \
          -f visibility=public 2>&1 || echo "(skipped — already public, missing, or insufficient token scope)"

  deploy:

    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: read

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
        envs: GITHUB_TOKEN
        script: |
          # Fail on the FIRST failing command. Without this a missing .env made all three compose
          # commands no-ops while the job still reported success, because the last line (prune)
          # exited 0.
          set -e

          mkdir -p /var/www/code-coverage
          cd /var/www/code-coverage

          # .env and github-app.pem are server-managed; deploys never write them. Only the compose
          # file is refreshed from the repo, so service/label changes ship with the push.
          test -f .env || { echo "::error::/var/www/code-coverage/.env is missing — create it from apps/CodeCoverage/.env.example (server-managed, never written by deploys)"; exit 1; }
          test -f github-app.pem || { echo "::error::/var/www/code-coverage/github-app.pem is missing — the GitHub App private key must be placed there (chmod 644)"; exit 1; }

          rm -f docker-compose.yml
          curl -sf -H "Authorization: token $GITHUB_TOKEN" -o docker-compose.yml \
            https://raw.githubusercontent.com/${{ github.repository }}/master/apps/CodeCoverage/docker-compose.yml

          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker compose --env-file .env pull
          docker compose --env-file .env down --remove-orphans
          docker compose --env-file .env up -d --remove-orphans

          docker image prune -f
          docker compose --env-file .env ps

          # Readiness that can actually fail. /health only proves the process answers;
          # /health/ready round-trips the GitHub App JWT to GitHub, so a wrong github-app.pem fails
          # THIS deploy instead of surfacing hours later inside check-runs. Budget matches the
          # compose healthcheck's start_period (60s) plus probe slack.
          for i in $(seq 1 18); do
            sleep 10
            code=$(docker compose --env-file .env exec -T coverage-app bash -c "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3" | grep -o '[0-9][0-9][0-9]' | head -1 || echo 000)
            echo "readiness attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            if [ "$code" = "503" ]; then echo "::error::/health/ready reports the GitHub App key is unusable — verify github-app.pem against the App's fingerprint (see apps/CodeCoverage/README.md, Deployment)"; exit 1; fi
          done
          echo "::error::service did not become ready within 180s"
          exit 1
