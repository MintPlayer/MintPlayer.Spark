name: regenerate

# The CodeCoverage merge queue's post-rebase step for this repository (coverage.yml `mergeQueue:`,
# docs/coverage_merge_queue_PRD.md §5.6). The queue dispatches it on mq/<base>/pr-<n> after a rebase it
# resolved; it regenerates the Spark files of every app and uploads them as the `merge-queue-patch`
# artifact. It never commits or pushes: the queue validates the patch against `regeneratedPaths` and
# pushes it with the App token.
#
# SECURITY: this workflow builds and runs untrusted pull-request code. No environment, no `id-token`, no
# self-hosted runner, and `persist-credentials: false` on the checkout. The queue never dispatches it for a
# PR that touches .github/** (unless the bypass role lets a same-repository one through; a fork's never,
# O25), and checks this file's blob on the mq/ branch against master's before it dispatches (D12), because
# a dispatched run uses the workflow file from the dispatched branch.
#
# Two jobs, one per kind of pull request (owner, 2026-11-07). The queue sends `fork: true` for a fork's pull
# request, because this file declares the input:
# - `fork` runs the fork's code with `contents: read` and no credential at all, restoring from nuget.org only
#   (every MintPlayer.* package is there too, minutes after the GitHub feed).
# - `trusted` runs a same-repository pull request's or a backport's code with the run's GITHUB_TOKEN and
#   `packages: read`, because nuget.config maps MintPlayer.* to the GitHub Packages feed, which refuses
#   anonymous reads (the first runs, on #580's backports, failed with 401).
# CodeCoverage's fork guard exempts only a job whose `if:` is exactly `!inputs.fork`; keep it that way.
#
# The app list is the verify steps' list in pull-request.yml; keep the two equal (in both jobs).

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: The commit the merge queue prepared. The run fails if the branch head differs.
        required: true
      pr_number:
        description: The pull request being merged (shown in the run name only).
        required: true
      queue_run_id:
        description: The merge queue's id for this attempt (shown in the run name only).
        required: true
      fork:
        description: Set by the queue for a fork's pull request; that run gets no credential.
        type: boolean
        required: false
        default: false

run-name: 'regenerate PR #${{ inputs.pr_number }} (${{ inputs.queue_run_id }})'

permissions:
  contents: read

concurrency:
  group: regenerate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork:
    if: ${{ inputs.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The dispatched mq/ branch as of the dispatch; the action compares it with expected_sha (D14).
          ref: ${{ github.sha }}
          persist-credentials: false

      # nuget.org only, outside the checkout so the patch never contains it.
      - name: NuGet config without the GitHub feed
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<configuration>' '  <packageSources>' '    <clear />' \
            '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />' \
            '  </packageSources>' '</configuration>' > "$RUNNER_TEMP/nuget.org.config"

      - uses: ./.github/actions/spark-regenerate
        with:
          expected_sha: ${{ inputs.expected_sha }}
          extra-build-args: -p:RestoreConfigFile=${{ runner.temp }}/nuget.org.config
          projects: |
            apps/DemoApp/DemoApp/DemoApp.csproj
            apps/HR/HR/HR.csproj
            apps/Fleet/Fleet/Fleet.csproj
            apps/QnA/QnA/QnA.csproj
            apps/SparkId/SparkId/SparkId.csproj
            apps/CodeCoverage/CodeCoverage/CodeCoverage.csproj
            apps/SeoTester/SeoTester/SeoTester.csproj
          # The layering goldens are derived from the apps' App_Data, like modelHashes.json: rewritten, never merged.
          after-synchronize: |
            SPARK_UPDATE_GOLDEN=1 dotnet test tests/MintPlayer.Spark.Tests/MintPlayer.Spark.Tests.csproj -c "$CONFIGURATION" $BUILD_ARGS \
              --filter "FullyQualifiedName~MintPlayer.Spark.Tests.Layering"

  trusted:
    if: ${{ !inputs.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # nuget.config's github-mintplayer source, as in pull-request.yml.
    env:
      GH_PKG_USER: ${{ github.actor }}
      GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The dispatched mq/ branch as of the dispatch; the action compares it with expected_sha (D14).
          ref: ${{ github.sha }}
          persist-credentials: false

      # The local copy, so a change to the action is exercised by this repository's own queue.
      - uses: ./.github/actions/spark-regenerate
        with:
          expected_sha: ${{ inputs.expected_sha }}
          projects: |
            apps/DemoApp/DemoApp/DemoApp.csproj
            apps/HR/HR/HR.csproj
            apps/Fleet/Fleet/Fleet.csproj
            apps/QnA/QnA/QnA.csproj
            apps/SparkId/SparkId/SparkId.csproj
            apps/CodeCoverage/CodeCoverage/CodeCoverage.csproj
            apps/SeoTester/SeoTester/SeoTester.csproj
          # The layering goldens are derived from the apps' App_Data, like modelHashes.json: rewritten, never merged.
          after-synchronize: |
            SPARK_UPDATE_GOLDEN=1 dotnet test tests/MintPlayer.Spark.Tests/MintPlayer.Spark.Tests.csproj -c "$CONFIGURATION" $BUILD_ARGS \
              --filter "FullyQualifiedName~MintPlayer.Spark.Tests.Layering"
