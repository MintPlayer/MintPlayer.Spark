name: versioning-action-publish

# Republishes the versioning action's bundle and moves the tags consumers pin
# (docs/coverage_package_versioning_PRD.md D2/D3: `uses: ...versioning-action@versioning-v1`). Modelled on
# dependency-action-publish.yml and coverage-action-publish.yml; the reasoning there applies here unchanged:
#
#   versioning-v<full>   cut once, on one commit, never moved: a repository bitten by a release can pin backwards.
#   versioning-v<major>  force-moved to the latest commit of that major: what the onboarding pull request pins,
#                        so a fix reaches every repository with no PR anywhere.
#
# `mode: local` runs the engine of the pinned commit (CodeCoverage.Versioning.Cli and the CodeCoverage.Versioning
# library it references), so an engine change moves the tag too: the local host must run the same engine the server
# runs (D2). The tags point at a commit on top of master's that also holds the engine prebuilt (#552 D8); a checkout
# of master itself has none and runs the engine from source.
#
# Its own workflow for the `paths:` filter: the moving tag must only move for a commit that touched the
# action or its engine, never for an unrelated master push.

on:
  push:
    branches:
      - master
    paths:
      - 'apps/CodeCoverage/versioning-action/**'
      # Docs only: moving the tag would hand every consumer an action bump with no code in it.
      - '!apps/CodeCoverage/versioning-action/**/*.md'
      # The engine local mode runs from source.
      - 'apps/CodeCoverage/CodeCoverage.Versioning/**'
      - 'apps/CodeCoverage/CodeCoverage.Versioning.Cli/**'
      - '.github/workflows/versioning-action-publish.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to apply before publishing (none = just repack)"
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

# Queue rather than cancel: two publishers racing to force-move the major tag is worse than waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish versioning action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    # `--no-git-tag-version`: npm would cut a bare `v1.0.1` tag in the monorepo's shared namespace.
    # A GITHUB_TOKEN push does not trigger workflows, so bumping cannot re-enter this workflow.
    - name: Bump the action's version
      if: inputs.bump != '' && inputs.bump != 'none'
      run: |
        cd apps/CodeCoverage/versioning-action
        npm version "${BUMP}" --no-git-tag-version
        version="$(node -p "require('./package.json').version")"
        cd "$GITHUB_WORKSPACE"

        git config --local user.name  'github-actions[bot]'
        git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add apps/CodeCoverage/versioning-action/package.json apps/CodeCoverage/versioning-action/package-lock.json
        git commit -m "release(versioning-action): ${version}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
        echo "Bumped to ${version}."
      env:
        BUMP: ${{ inputs.bump }}

    # Both tag names from ONE source, the action's package.json version (see coverage-action-publish.yml
    # for why a hard-coded major tag is a trap).
    - name: Derive the action's tag names
      id: tags
      run: |
        version="$(node -p "require('./apps/CodeCoverage/versioning-action/package.json').version")"
        major="${version%%.*}"
        case "$major" in
          ''|*[!0-9]*)
            echo "::error::Could not read a numeric major version from apps/CodeCoverage/versioning-action/package.json (got '${version}')."
            exit 1
            ;;
        esac
        echo "major=versioning-v${major}" >> "$GITHUB_OUTPUT"
        echo "Moving tag: versioning-v${major} (from version ${version})"

        # Cut the immutable tag only when this version does not have one yet; otherwise just repack and
        # re-point the moving tag (a README-only change must not turn master red).
        if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/versioning-v${version}" >/dev/null 2>&1; then
          echo "version-from=" >> "$GITHUB_OUTPUT"
          echo "::notice::Version ${version} is already tagged. Run this workflow with a bump (patch/minor/major) to release a new one."
        else
          echo "version-from=apps/CodeCoverage/versioning-action/package.json" >> "$GITHUB_OUTPUT"
          echo "Will cut versioning-v${version}."
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    # Our own steps rather than compile-ts-action (#552 S1): that action commits its output to the branch it runs on,
    # and the prebuilt engine below must land only on the tag commit, never on master.
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.x

    - name: Test and rebuild the bundle
      working-directory: apps/CodeCoverage/versioning-action
      run: |
        npm ci
        npm test
        npm run build

    # The pull-request workflow already fails on a stale dist, so this is normally a no-op.
    - name: Commit a changed bundle to master
      run: |
        git config --local user.name  'github-actions[bot]'
        git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
        if [ -n "$(git status --porcelain -- apps/CodeCoverage/versioning-action/dist)" ]; then
          git add apps/CodeCoverage/versioning-action/dist
          git commit -m 'build: repack the versioning bundle'
          git push origin "HEAD:${GITHUB_REF_NAME}"
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    # #552 D8: the engine prebuilt, so a consumer's step runs `dotnet <dll>` instead of building it (about 19 s cold).
    # net8.0 with RollForward=Major, framework-dependent: it runs on whatever runtime the runner has. It is committed
    # on a detached commit on top of master's, which only the tags point at.
    - name: Publish the engine onto the tag commit and tag it
      run: |
        engine=apps/CodeCoverage/versioning-action/engine
        dotnet publish apps/CodeCoverage/CodeCoverage.Versioning.Cli --configuration Release --output "$engine" \
          -p:UseAppHost=false -p:DebugType=none -p:GenerateDocumentationFile=false
        test -f "$engine/codecoverage-versioning.dll"

        git checkout --detach
        git add --force "$engine"
        git commit -m "build: the versioning action with its prebuilt engine (${MAJOR})"
        if [ -n "${VERSION_FROM}" ]; then
          version="versioning-v$(node -p "require('./${VERSION_FROM}').version")"
          git tag "$version"
          git push origin "refs/tags/${version}"
          echo "Cut ${version}."
        fi
        git tag --force "${MAJOR}"
        git push --force origin "refs/tags/${MAJOR}"
        echo "Moved ${MAJOR} to $(git rev-parse HEAD)."
      env:
        MAJOR: ${{ steps.tags.outputs.major }}
        VERSION_FROM: ${{ steps.tags.outputs.version-from }}
