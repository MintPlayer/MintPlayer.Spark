name: publish-release

on:
  push:
    branches:
      - 'master'

# One run at a time on master. Besides saving runners, this serialises the schema-revision job
# below: two runs deciding "the schemas changed, the next revision is v{n+1}" at the same time
# would both try to create it. A run cancelled part-way is harmless there: the release is created
# by one API call, and the next run compares against whatever exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}
  # See pull-request.yml: measures the E2E suite's Fleet host under dotnet-coverage.
  SPARK_E2E_HOST_COVERAGE: 'true'

jobs:
  # #264 G-Q21: decides the Spark JSON schema revision the packages embed, BEFORE anything is built
  # or packed. The schemas are generated from this commit and compared byte-for-byte with the
  # assets of the latest schemas/v{n} GitHub release:
  #   - identical (or no change in what the C# types describe): the packages embed n;
  #   - different, or no release yet: this job creates the release schemas/v{n+1} (which also
  #     creates the tag, on this commit) with the six files, asks spark-schemas-deploy.yml to put
  #     it online, and the packages embed n+1.
  # So a package can never name a revision whose release does not exist. A revision is published
  # even when a later step of this run fails; the next run then finds it identical and reuses it.
  #
  # A job of its own so that only this job holds `contents: write` (creating releases and tags)
  # and `actions: write` (dispatching the deploy); the build job below runs third-party code
  # (npm ci, the test suites) and keeps the read-only token.
  schema-revision:
    name: Schema revision
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      actions: write

    outputs:
      revision: ${{ steps.revision.outputs.revision }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100-rc.1.26425.128

    # The generator references only MintPlayer.Spark.Abstractions; the schemas depend on nothing
    # but the C# types, so a Debug build is enough. Its own after-build target also writes
    # schemas/; running it explicitly makes the output path this step's, not a side effect's.
    - name: Generate the schemas
      run: dotnet run --project tools/SchemaGenerator/MintPlayer.Spark.SchemaGenerator.csproj -- "$GITHUB_WORKSPACE/schemas"

    - name: Compare with the latest release, and publish a new revision if they differ
      id: revision
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail

        # Releases, not tags, are the source of truth: a revision exists when its release (with the
        # assets the site serves) does. Drafts are skipped; numeric sort, so v10 follows v9.
        latest="$(gh api --paginate "repos/$REPO/releases?per_page=100" \
          --jq '.[] | select(.draft | not) | .tag_name' \
          | sed -nE 's|^schemas/v([0-9]+)$|\1|p' | sort -n | tail -1)"
        latest="${latest:-0}"

        changed=true
        if [ "$latest" -gt 0 ]; then
          published="$RUNNER_TEMP/schemas-v$latest"
          mkdir -p "$published"
          gh release download "schemas/v$latest" --repo "$REPO" --dir "$published" --pattern '*.schema.json'
          # Byte-for-byte, the whole set: a file added or removed counts as a change too.
          if diff -r "$GITHUB_WORKSPACE/schemas" "$published"; then
            changed=false
          fi
        fi

        if [ "$changed" = true ]; then
          revision=$((latest + 1))
          gh release create "schemas/v$revision" "$GITHUB_WORKSPACE"/schemas/*.schema.json \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Spark JSON schemas v$revision" \
            --latest=false \
            --notes "The JSON schemas of Spark's App_Data files, generated from $GITHUB_SHA. Served at https://schemas.spark.mintplayer.com/v$revision/<file>.schema.json; --spark-synchronize-model writes that URL into \"\$schema\"."
          echo "Published schemas/v$revision."

          # A release created with GITHUB_TOKEN triggers no workflow (GitHub suppresses events
          # caused by that token, to prevent loops), so `on: release` alone would never fire for
          # it. workflow_dispatch is the documented exception.
          gh workflow run spark-schemas-deploy.yml --repo "$REPO" --ref "${{ github.event.repository.default_branch }}"
        else
          revision=$latest
          echo "The schemas match schemas/v$revision."
        fi

        echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    name: publish-release
    needs: schema-revision
    runs-on: ubuntu-latest
    # Build + full test sweep + pack + publish normally lands well under this;
    # the ceiling exists so a wedged run can't hold the 6-hour default.
    timeout-minutes: 45

    env:
      # Read by MintPlayer.Spark.csproj (an environment variable is an MSBuild property) and
      # compiled in as SparkSchemaRevision.Current. It is also an input of every `build:release`
      # task in nx.json, so a cached Release build of another revision is never replayed into
      # the packages.
      SparkSchemaRevision: ${{ needs.schema-revision.outputs.revision }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100-rc.1.26425.128
        # Authenticates packages to push to GPR
        source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      env:
        NUGET_AUTH_TOKEN: '%NUGET_AUTH_TOKEN%'

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Install npm dependencies
      run: npm ci

    # `nx <target>` for .NET projects uses `dotnet build --no-restore`, so
    # restore must run first on a fresh runner with no cache hit on `obj/`.
    - name: Install dependencies
      run: dotnet restore
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    # dotnet-coverage, for the E2E Fleet host (SPARK_E2E_HOST_COVERAGE above).
    - name: dotnet tool restore
      run: dotnet tool restore

    # Build everything via Nx so master populates the self-hosted remote
    # cache that PRs read from. Two run-many calls because:
    #   - .NET projects have a `build:release` target (Release config —
    #     produces bin/Release/ artifacts that `dotnet pack --no-build`
    #     consumes below).
    #   - Angular libraries (@mintplayer/ng-spark, @mintplayer/ng-spark-auth)
    #     only have a `build` target and produce ng-packagr `dist/` for the
    #     `JS-DevTools/npm-publish` steps below.
    - name: Build .NET projects (Release)
      run: npx nx run-many --target=build:release

    # Pack MUST run immediately after the Release build, before any other Nx
    # invocation. Nx cache replay is destructive: it deletes a task's declared
    # output directories before extracting the cached archive. The Debug
    # `build` tasks that the `test` step replays used to declare the whole
    # bin/ + obj/ as outputs, so a cache-hit test step wiped the bin/Release
    # artifacts this pack consumes (preview.43 release failure, run
    # 31778271642 — preview.42 only survived because some cached archives
    # happened to contain Release artifacts). nx.json now scopes each
    # configuration's outputs to its own directory, and pack runs here so no
    # later step can starve it either way. Output goes to nupkgs/ (outside
    # any project's bin/) so cache replays can't delete the packages; the
    # push steps below stay after the tests, so publishing is still gated on
    # a green test run.
    - name: Pack
      run: dotnet pack --no-build --configuration Release /p:ContinuousIntegrationBuild=true -o nupkgs

    - name: Build Angular libraries
      run: npx nx run-many --target=build --projects=@mintplayer/ng-spark,@mintplayer/ng-spark-auth

    - name: Resolve Playwright version
      id: playwright
      run: |
        version=$(grep -oE 'Microsoft\.Playwright"[[:space:]]*Version="[^"]+"' tests/MintPlayer.Spark.E2E.Tests/MintPlayer.Spark.E2E.Tests.csproj \
          | grep -oE 'Version="[^"]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    # All test projects (.NET + Angular) run via Nx so master populates the remote
    # cache that PRs read from. The .NET test target's coverage args live in each
    # test project's project.json so the layout (`{ProjectName}/coverage/{guid}/
    # coverage.cobertura.xml`) is identical between PR and master runs — matches
    # the glob pattern each flagged codecov upload step below uses.
    - name: Test (all projects via Nx)
      # Step-level so a wedged test run (the intermittent E2E hang) fails here
      # and the `if: always()` coverage upload below still runs.
      timeout-minutes: 20
      # --output-style=stream: see pull-request.yml — buffered output hides
      # where a hung test task is stuck.
      run: npx nx run-many --target=test --output-style=stream
      env:
        RAVENDB_LICENSE: ${{ secrets.RAVENDB_LICENSE }}

    # Master runs every test project unconditionally, so this is a whole-
    # workspace upload (no `partial`) — it becomes the baseline the Coverage
    # server compares partial PR uploads against.
    # A report path the server cannot resolve is dropped SILENTLY -- it is simply
    # absent from the percentage, which reads as a coverage drop rather than as a
    # bug. This runs the server's own resolution rules over every report before
    # upload and fails the build instead, so the failure mode that hid five dead
    # queues cannot also hide a shrinking denominator.
    - name: Verify coverage report paths
      if: always()
      run: node tools/verify-coverage-paths.mjs

    - name: Upload coverage
      if: always() && hashFiles('tests/*/coverage/**/coverage.cobertura.xml', 'apps/CodeCoverage/*/coverage/**/coverage.cobertura.xml', 'libs/node_packages/*/coverage/cobertura-coverage.xml', 'apps/CodeCoverage/CodeCoverage/ClientApp/coverage/cobertura-coverage.xml', 'coverage/@spark-apps/code-coverage/cobertura-coverage.xml', 'apps/CodeCoverage/action/coverage/cobertura-coverage.xml') != ''
      # The working copy — the action's source lives in this repository now.
      uses: ./apps/CodeCoverage/action
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          tests/*/coverage/**/coverage.cobertura.xml
          apps/CodeCoverage/*/coverage/**/coverage.cobertura.xml
          libs/node_packages/*/coverage/cobertura-coverage.xml
          apps/CodeCoverage/CodeCoverage/ClientApp/coverage/cobertura-coverage.xml
          coverage/@spark-apps/code-coverage/cobertura-coverage.xml
          apps/CodeCoverage/action/coverage/cobertura-coverage.xml
        disable-search: true
        finish: true
        fail-ci-if-error: false

    - name: PushNuget
      run: dotnet nuget push 'nupkgs/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.PUBLISH_TO_NUGET_ORG }} --skip-duplicate

    - name: PushGithub
      run: dotnet nuget push 'nupkgs/*.nupkg' --no-symbols --skip-duplicate
      env:
        NUGET_AUTH_TOKEN: ${{ github.token }}

    - name: Push ng-spark to NPM
      uses: JS-DevTools/npm-publish@v4
      with:
        package: 'libs/node_packages/ng-spark/dist/package.json'
        registry: 'https://registry.npmjs.org'
        token: ${{ secrets.PUBLISH_TO_NPMJS }}
        access: 'public'
        provenance: true

    - name: Push ng-spark to Github
      uses: JS-DevTools/npm-publish@v4
      with:
        package: 'libs/node_packages/ng-spark/dist/package.json'
        registry: 'https://npm.pkg.github.com'
        token: ${{ github.token }}
        access: 'public'
        provenance: true

    - name: Push ng-spark-auth to NPM
      uses: JS-DevTools/npm-publish@v4
      with:
        package: 'libs/node_packages/ng-spark-auth/dist/package.json'
        registry: 'https://registry.npmjs.org'
        token: ${{ secrets.PUBLISH_TO_NPMJS }}
        access: 'public'
        provenance: true

    - name: Push ng-spark-auth to Github
      uses: JS-DevTools/npm-publish@v4
      with:
        package: 'libs/node_packages/ng-spark-auth/dist/package.json'
        registry: 'https://npm.pkg.github.com'
        token: ${{ github.token }}
        access: 'public'
        provenance: true
