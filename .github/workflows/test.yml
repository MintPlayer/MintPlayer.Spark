name: test

# Every test project, as parallel jobs. Called by pull-request.yml and dotnet-build-master.yml, so both
# measure the same thing. One `nx run-many --target=test` used to run them all in one job, where the wall
# time was MintPlayer.Spark.Tests alone (~8 min of a ~9 min step, behind ~3.5 min of setup and build).
# Here that project runs in four shards (tools/test-shard.mjs) beside the other long suites.
#
# run-many, NOT affected, in every job: `test` declares its coverage directories as cached outputs
# (nx.json), so an unaffected project's report is RESTORED from the cache rather than regenerated, and
# the coverage upload still gets a report for every project (PR #377 uploaded 1 report of 8 under
# `affected`). Each job hands its reports to the caller's coverage job as an artifact; that job uploads
# them together, exactly as the single job used to.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  # nuget.config restores MintPlayer.* from GitHub Packages, which needs a token even for public packages.
  GH_PKG_USER: ${{ github.actor }}
  GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  # Same rule as pull-request.yml (segment H, Q16 = B); a called workflow sees its caller's event.
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ ((github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'mintplayer/dependencies'))) && secrets.NX_CACHE_RW_TOKEN || '' }}
  # Runs the E2E suite's Fleet host under dotnet-coverage (FleetTestHost.HostCoverageEnabled).
  SPARK_E2E_HOST_COVERAGE: 'true'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every suite reports even when another fails: one red shard must not hide the rest.
      fail-fast: false
      matrix:
        include:
          - { name: Spark.Tests 1/4, artifact: spark-1, projects: MintPlayer.Spark.Tests, shard: 1/4 }
          - { name: Spark.Tests 2/4, artifact: spark-2, projects: MintPlayer.Spark.Tests, shard: 2/4 }
          - { name: Spark.Tests 3/4, artifact: spark-3, projects: MintPlayer.Spark.Tests, shard: 3/4 }
          - { name: Spark.Tests 4/4, artifact: spark-4, projects: MintPlayer.Spark.Tests, shard: 4/4 }
          - { name: E2E 1/2, artifact: e2e-1, projects: MintPlayer.Spark.E2E.Tests, shard: 1/2, playwright: true }
          - { name: E2E 2/2, artifact: e2e-2, projects: MintPlayer.Spark.E2E.Tests, shard: 2/2, playwright: true }
          - { name: CodeCoverage.Tests, artifact: codecoverage, projects: CodeCoverage.Tests }
          - { name: SeoTester.Tests 1/2, artifact: seotester-1, projects: SeoTester.Tests, shard: 1/2, playwright: true }
          - { name: SeoTester.Tests 2/2, artifact: seotester-2, projects: SeoTester.Tests, shard: 2/2, playwright: true }
          # #536 M9: the provider-neutral classes of MintPlayer.Spark.Tests (trait SparkDatabase=Any, SparkTestTraits)
          # and the relational suite, on a real server each. The "Databases" steps start it. The RavenDB shards above run
          # the same neutral classes on RavenDB.
          - { name: SQL Server, artifact: sqlserver, projects: 'MintPlayer.Spark.Tests,MintPlayer.Spark.Relational.Tests', database: SqlServer }
          - { name: PostgreSQL, artifact: postgresql, projects: 'MintPlayer.Spark.Tests,MintPlayer.Spark.Relational.Tests', database: PostgreSql }
          # The smaller suites in groups of a few minutes each. One "Other suites" job used to run them all and
          # set the pace of the whole run (9.3 min, 16-22 min once the commerce suites joined it).
          # The library and CodeCoverage git suites share a job since the database legs joined (M9): 3.4 and 2.4 min
          # apart, ~1.5 min of each being setup, against the E2E shard's 7.
          - { name: Library + git suites, artifact: libs, projects: 'MintPlayer.Spark.SourceGenerators.Tests,MintPlayer.Spark.Client.Tests,MintPlayer.Spark.Gs1.Tests,MintPlayer.Migration.Tests,CodeCoverage.Git.Tests,CodeCoverage.GitMirror.Tests,CodeCoverage.GitWriter.Tests' }
          - { name: App suites, artifact: apps, projects: 'DemoApp.Tests,SparkId.Tests,Fleet.Tests,QnA.Tests,HR.Tests,MintPlayer.Tests' }
          # The Angular and action suites (vitest), among them the dependency-update action's `test` target
          # (unit + committed-bundle smoke test).
          - { name: Angular suites, artifact: angular, projects: '@mintplayer/ng-spark,@spark-apps/*,@spark-demo/*,@mintplayer/coverage-upload-action,@mintplayer/dependency-update-action,@mintplayer/webhooks-receiver' }
          # Everything not named above, so a new test project runs without being added here. Keep this list
          # in step with the entries above.
          - { name: Other suites, artifact: other, exclude: 'MintPlayer.Spark.Tests,MintPlayer.Spark.Relational.Tests,MintPlayer.Spark.E2E.Tests,CodeCoverage.Tests,SeoTester.Tests,MintPlayer.Spark.SourceGenerators.Tests,MintPlayer.Spark.Client.Tests,MintPlayer.Spark.Gs1.Tests,MintPlayer.Migration.Tests,CodeCoverage.Git.Tests,CodeCoverage.GitMirror.Tests,CodeCoverage.GitWriter.Tests,DemoApp.Tests,SparkId.Tests,Fleet.Tests,QnA.Tests,HR.Tests,MintPlayer.Tests,@mintplayer/ng-spark,@spark-apps/*,@spark-demo/*,@mintplayer/coverage-upload-action,@mintplayer/dependency-update-action,@mintplayer/webhooks-receiver' }
          # The dependency-update action against real package managers and LOCAL registries
          # (docs/code-coverage/dependency-updates-PRD.md §13.11.2): its own `test-integration` target, so
          # "Other suites" (target `test`) never runs it. Two ecosystem groups per slice, 15 minutes each;
          # the Nx cache makes an unchanged action about a minute.
          # Two slices, not four: a public repository runs at most 20 jobs at once, and at 22 a Spark shard
          # waited 2.3 min for a runner and set the run's pace (run 39827710856). The four groups took
          # 1.5-2 min each there.
          - { name: 'dependency-action IT node+dotnet, jvm', artifact: dep-it-node-dotnet-jvm, projects: '@mintplayer/dependency-update-action', target: test-integration, itGroup: 'node+dotnet,jvm', timeout: 15 }
          - { name: 'dependency-action IT python+go+rust+php, docker+renovate', artifact: dep-it-python-go-rust-php-docker-renovate, projects: '@mintplayer/dependency-update-action', target: test-integration, itGroup: 'python+go+rust+php,docker+renovate', timeout: 15 }

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # #536 M9: the database legs' servers, started before Setup so they boot while it runs; "Run tests" waits for them,
    # bounded. Detached containers, not job `services:`, like OpenSearch below. The password is made per run and masked:
    # nothing outside the runner reaches these servers. The image is pinned (O8: SQL Server 2025, PostgreSQL 18) and
    # named in SPARK_TEST_*_IMAGE, which tools/test-servers.mjs puts in the Nx cache key. PostgreSQL 17, the floor, runs
    # the D31 behaviour tests only ("PostgreSQL 17" below). fsync and friends are off: a throwaway server, and the
    # suites create a database per class or case.
    - name: Databases
      if: matrix.database
      run: |
        password="Sp1-$(openssl rand -hex 16)"
        echo "::add-mask::$password"
        if [ "${{ matrix.database }}" = SqlServer ]; then
          image=2025-CU11-ubuntu-24.04
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" "mcr.microsoft.com/mssql/server:$image"
          echo "SPARK_TEST_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$password;TrustServerCertificate=true;Encrypt=false" >> "$GITHUB_ENV"
          echo "SPARK_TEST_SQLSERVER_IMAGE=$image" >> "$GITHUB_ENV"
        else
          image=18.7
          for server in "postgres 5432 $image" "postgres17 5433 17.12"; do
            set -- $server
            docker run -d --name "$1" -p "$2:5432" -e POSTGRES_PASSWORD="$password" "postgres:$3" \
              -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          done
          echo "SPARK_TEST_POSTGRESQL=Host=localhost;Port=5432;Username=postgres;Password=$password" >> "$GITHUB_ENV"
          echo "SPARK_TEST_POSTGRESQL_IMAGE=$image" >> "$GITHUB_ENV"
          echo "SPARK_TEST_POSTGRESQL17=Host=localhost;Port=5433;Username=postgres;Password=$password" >> "$GITHUB_ENV"
        fi

    - name: Setup
      uses: ./.github/actions/setup
      with:
        nuget-token: ${{ github.token }}

    - name: Playwright
      if: matrix.playwright
      uses: ./.github/actions/playwright

    # #238: the OpenSearch provider's tests (Search/OpenSearchEngineTests) need a real engine; without
    # SPARK_OPENSEARCH_URI they skip. Started detached, not as a job `services:` container, so nothing
    # waits on its health check before "Run tests", which waits for it, bounded (2 min). On every
    # Spark shard because the shard packing decides which one holds the class. Same pin as mintplayer.com
    # (apps/MintPlayer/opensearch/Dockerfile).
    - name: OpenSearch
      if: matrix.projects == 'MintPlayer.Spark.Tests'
      run: |
        docker run -d --name opensearch -p 9200:9200 \
          -e discovery.type=single-node -e DISABLE_SECURITY_PLUGIN=true -e DISABLE_INSTALL_DEMO_CONFIG=true \
          -e OPENSEARCH_JAVA_OPTS='-Xms512m -Xmx512m' \
          opensearchproject/opensearch:3.9.0
        echo "SPARK_OPENSEARCH_URI=http://localhost:9200" >> "$GITHUB_ENV"

    # #700 M5: the Azure Blob and S3 file stores' conformance tests (Files/Stores) need a server; without
    # SPARK_AZURITE_CONNECTION_STRING / SPARK_S3_* they skip. Azurite starts in a second; Garage is set up here
    # (layout, bucket, a key generated per run) by tools/ci/start-garage.sh, the version spike SP9 ran.
    - name: File stores
      if: matrix.projects == 'MintPlayer.Spark.Tests'
      run: |
        docker run -d --name azurite -p 10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0 \
          azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
        echo "SPARK_AZURITE_CONNECTION_STRING=UseDevelopmentStorage=true" >> "$GITHUB_ENV"
        bash tools/ci/start-garage.sh > "$RUNNER_TEMP/garage.env"
        # Throwaway, but kept out of the job log all the same.
        echo "::add-mask::$(grep '^SPARK_S3_SECRET_KEY=' "$RUNNER_TEMP/garage.env" | cut -d= -f2)"
        cat "$RUNNER_TEMP/garage.env" >> "$GITHUB_ENV"

    # #700 M7: the ClamAV client's live tests (Files/Scanning/ClamAVIntegrationTests) need clamd; without
    # SPARK_CLAMAV_HOST they skip. The package's own clamd.conf is mounted, so its AlertExceedsMax is what is
    # tested. CLAMAV_NO_FRESHCLAMD: the image bundles signatures; no CDN download per run. Detached like
    # OpenSearch; "Run tests" waits for the readiness line, bounded.
    - name: ClamAV
      if: matrix.projects == 'MintPlayer.Spark.Tests'
      run: |
        docker run -d --name clamav -p 3310:3310 -e CLAMAV_NO_FRESHCLAMD=true \
          -v "$GITHUB_WORKSPACE/libs/files/MintPlayer.Spark.Files.ClamAV/clamd.conf:/etc/clamav/clamd.conf:ro" \
          clamav/clamav-debian:1.5.5
        echo "SPARK_CLAMAV_HOST=localhost:3310" >> "$GITHUB_ENV"

    # The package managers ubuntu-latest lacks, at the versions the S13/S14 spikes ran. npm, yarn,
    # dotnet, java/maven/gradle, go, cargo, php/composer and docker are on the image already.
    - name: Integration toolchains
      if: contains(matrix.itGroup, 'node+dotnet') || contains(matrix.itGroup, 'python+go+rust+php')
      run: |
        npm install -g pnpm@10.18.0 --ignore-scripts
        pipx install uv==0.13.1

    # Maven's own plugins come from Maven Central on a fresh runner (jvm.integration.test.ts's header); the artifacts
    # under test come from a file:// repository. A download that stalls hung the Maven test at vitest's 300 s on PR #694
    # (run 44337506945) and PR #704 (run 45091276261), so the plugins are cached. The key follows the jvm tests, which
    # name what Maven resolves; restore-keys reuse the last cache when they change, and Maven fetches only what is new.
    - name: Maven repository cache
      if: contains(matrix.itGroup, 'jvm')
      uses: actions/cache@v6
      with:
        # Not the artifacts under test: each run resolves them from its own file:// repository.
        path: |
          ~/.m2/repository
          !~/.m2/repository/com/acme
        key: dep-it-m2-${{ runner.os }}-${{ hashFiles('apps/CodeCoverage/dependency-action/src/integration/jvm.integration.test.ts') }}
        restore-keys: dep-it-m2-${{ runner.os }}-

    - name: Run tests
      # Step-level, so a hung suite fails here and the artifact upload below still runs with what the
      # suite produced. The large .NET suites also carry --blame-hang (5-10 min per test) in their nx
      # command, which names the hung test instead of just timing out.
      timeout-minutes: ${{ matrix.timeout || 20 }}
      # --output-style=stream: nx buffers each task's output until the task finishes, so a hung task
      # prints NOTHING. Streaming trades tidy grouping for a visible last line.
      run: |
        if [ -n "$SPARK_OPENSEARCH_URI" ]; then
          for i in $(seq 1 60); do curl -fs "$SPARK_OPENSEARCH_URI" > /dev/null && break; sleep 2; done
          curl -fs "$SPARK_OPENSEARCH_URI" > /dev/null || { docker logs opensearch | tail -50; exit 1; }
        fi
        if [ -n "$SPARK_CLAMAV_HOST" ]; then
          for i in $(seq 1 90); do docker logs clamav 2>&1 | grep -q "socket found, clamd started" && break; sleep 2; done
          docker logs clamav 2>&1 | grep -q "socket found, clamd started" || { docker logs clamav 2>&1 | tail -50; exit 1; }
        fi
        # Ready means what the suites do first works: creating a database, which fails while model is still recovering
        # even though logins already succeed. sqlcmd ships in the image and reads the container's own password.
        if [ "${{ matrix.database }}" = SqlServer ]; then
          probe() { docker exec mssql bash -c 'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "CREATE DATABASE spark_ready; DROP DATABASE spark_ready"'; }
          for i in $(seq 1 60); do probe > /dev/null 2>&1 && break; sleep 2; done
          probe || { docker logs mssql 2>&1 | tail -50; exit 1; }
        fi
        # Over TCP: the image's first-start initialisation runs a server on the Unix socket only.
        if [ "${{ matrix.database }}" = PostgreSql ]; then
          for server in postgres postgres17; do
            for i in $(seq 1 60); do docker exec "$server" pg_isready -h 127.0.0.1 -U postgres > /dev/null && break; sleep 1; done
            docker exec "$server" pg_isready -h 127.0.0.1 -U postgres || { docker logs "$server" 2>&1 | tail -50; exit 1; }
          done
        fi
        if [ -n "${{ matrix.projects }}" ]; then
          npx nx run-many --target=${{ matrix.target || 'test' }} --projects='${{ matrix.projects }}' --output-style=stream
        else
          npx nx run-many --target=test --exclude='${{ matrix.exclude }}' --output-style=stream
        fi
      env:
        # The integration tests' ecosystem slice; unset for every other suite.
        DEP_ACTION_IT_GROUP: ${{ matrix.itGroup }}
        # Only the integration slices see it, for Renovate's GitHub tag lookups (read-only).
        GITHUB_TOKEN: ${{ matrix.itGroup && github.token || '' }}
        RAVENDB_LICENSE: ${{ !matrix.itGroup && secrets.RAVENDB_LICENSE || '' }}
        # Read by tools/test-shard.mjs; an input of the MintPlayer.Spark.Tests task, so each shard is
        # cached on its own.
        SPARK_TEST_SHARD: ${{ matrix.shard }}
        # #536 D35: MintPlayer.Spark.Tests references four test databases (RavenDB, InMemory, SqlServer,
        # PostgreSql), so its provider-neutral classes need this to pick one. Assemblies with one provider
        # ignore it. A database leg names its own, and runs only the neutral classes (SPARK_TEST_FILTER, read by
        # tools/test-shard.mjs, so MintPlayer.Spark.Tests only).
        SPARK_TEST_DATABASE: ${{ matrix.database || 'RavenDB' }}
        SPARK_TEST_FILTER: ${{ matrix.database && 'SparkDatabase=Any' || '' }}

    # O8: PostgreSQL 17 is the floor, so the D31 behaviour tests, which pin what the provider relies on, run on it too.
    # Not through Nx: its cache key has no PostgreSQL version in it, and the class takes seconds.
    - name: PostgreSQL 17
      if: matrix.database == 'PostgreSql' && !cancelled()
      timeout-minutes: 5
      working-directory: tests/MintPlayer.Spark.Relational.Tests
      run: dotnet test --no-build --no-restore --filter "FullyQualifiedName~PostgreSqlBehaviourTests"
      env:
        SPARK_TEST_POSTGRESQL: ${{ env.SPARK_TEST_POSTGRESQL17 }}

    # upload-artifact roots the artifact at the deepest folder ALL matched files share, so a job that only
    # produced tests/MintPlayer.Spark.Tests/coverage/** would lose that prefix, and the coverage job would
    # put the reports where the server cannot resolve them. A file at the workspace root pins the root.
    - name: Pin the artifact root
      if: always()
      run: echo "${{ matrix.name }}" > coverage-artifact-root.txt

    # The coverage job downloads every artifact into ONE tree (merge-multiple), and a report folder's name is not unique
    # across jobs: VSTest names it `_<machine>_<second>`, and the hosted runners share a machine name. On PR #666 Spark
    # shards 1 and 4 both held `_runnervmccnms_2026-11-13_11_46_08`; the shorter file landed on the longer without
    # truncation, and its leftover tail (`OidcReques<line number=`) failed the path check. A suffix keeps every glob
    # (`coverage/**/`, `fleet-host-*`) matching.
    - name: Make the report folders unique to this job
      if: always()
      run: |
        for dir in tests/*/coverage/*/ apps/*/*/coverage/*/; do
          [ -d "$dir" ] && mv "${dir%/}" "${dir%/}--${{ matrix.artifact }}"
        done
        true

    # The same globs the coverage upload reads, plus the shards' trx files (per-class timings for
    # tools/test-shard.mjs --timings). Paths stay relative to the workspace root, so the coverage job can
    # download every artifact into one checkout and see the layout a single job used to produce.
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.artifact }}
        path: |
          coverage-artifact-root.txt
          tests/*/coverage/**/coverage.cobertura.xml
          tests/*/coverage/*.trx
          apps/*/*/coverage/*.trx
          apps/CodeCoverage/*/coverage/**/coverage.cobertura.xml
          libs/node_packages/*/coverage/cobertura-coverage.xml
          apps/CodeCoverage/CodeCoverage/ClientApp/coverage/cobertura-coverage.xml
          coverage/@spark-apps/code-coverage/cobertura-coverage.xml
          apps/CodeCoverage/action/coverage/cobertura-coverage.xml
          apps/CodeCoverage/dependency-action/coverage/cobertura-coverage.xml
        if-no-files-found: ignore
        retention-days: 7
