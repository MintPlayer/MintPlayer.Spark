name: test

# Every test project, as parallel jobs. Called by pull-request.yml and dotnet-build-master.yml, so both
# measure the same thing. One `nx run-many --target=test` used to run them all in one job, where the wall
# time was MintPlayer.Spark.Tests alone (~8 min of a ~9 min step, behind ~3.5 min of setup and build).
# Here that project runs in four shards (tools/test-shard.mjs) beside the other long suites.
#
# run-many, NOT affected, in every job: `test` declares its coverage directories as cached outputs
# (nx.json), so an unaffected project's report is RESTORED from the cache rather than regenerated, and
# the coverage upload still gets a report for every project (PR #377 uploaded 1 report of 8 under
# `affected`). Each job hands its reports to the caller's coverage job as an artifact; that job uploads
# them together, exactly as the single job used to.

on:
  workflow_call:

permissions:
  contents: read
  packages: read

env:
  # nuget.config restores MintPlayer.* from GitHub Packages, which needs a token even for public packages.
  GH_PKG_USER: ${{ github.actor }}
  GH_PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ secrets.NX_CACHE_SERVER }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: ${{ (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) && secrets.NX_CACHE_RW_TOKEN || secrets.NX_CACHE_RO_TOKEN }}
  # Runs the E2E suite's Fleet host under dotnet-coverage (FleetTestHost.HostCoverageEnabled).
  SPARK_E2E_HOST_COVERAGE: 'true'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every suite reports even when another fails: one red shard must not hide the rest.
      fail-fast: false
      matrix:
        include:
          - { name: Spark.Tests 1/4, artifact: spark-1, projects: MintPlayer.Spark.Tests, shard: 1/4 }
          - { name: Spark.Tests 2/4, artifact: spark-2, projects: MintPlayer.Spark.Tests, shard: 2/4 }
          - { name: Spark.Tests 3/4, artifact: spark-3, projects: MintPlayer.Spark.Tests, shard: 3/4 }
          - { name: Spark.Tests 4/4, artifact: spark-4, projects: MintPlayer.Spark.Tests, shard: 4/4 }
          - { name: E2E 1/2, artifact: e2e-1, projects: MintPlayer.Spark.E2E.Tests, shard: 1/2, playwright: true }
          - { name: E2E 2/2, artifact: e2e-2, projects: MintPlayer.Spark.E2E.Tests, shard: 2/2, playwright: true }
          - { name: CodeCoverage.Tests, artifact: codecoverage, projects: CodeCoverage.Tests }
          - { name: SeoTester.Tests 1/2, artifact: seotester-1, projects: SeoTester.Tests, shard: 1/2, playwright: true }
          - { name: SeoTester.Tests 2/2, artifact: seotester-2, projects: SeoTester.Tests, shard: 2/2, playwright: true }
          # The smaller suites in groups of a few minutes each. One "Other suites" job used to run them all and
          # set the pace of the whole run (9.3 min, 16-22 min once the commerce suites joined it).
          - { name: Library suites, artifact: libs, projects: 'MintPlayer.Spark.SourceGenerators.Tests,MintPlayer.Spark.Client.Tests,MintPlayer.Spark.Gs1.Tests,MintPlayer.Migration.Tests' }
          - { name: CodeCoverage git suites, artifact: codecoverage-git, projects: 'CodeCoverage.Git.Tests,CodeCoverage.GitMirror.Tests,CodeCoverage.GitWriter.Tests' }
          - { name: App suites, artifact: apps, projects: 'DemoApp.Tests,SparkId.Tests,Fleet.Tests,QnA.Tests,HR.Tests' }
          # The Angular and action suites (vitest), among them the dependency-update action's `test` target
          # (unit + committed-bundle smoke test).
          - { name: Angular suites, artifact: angular, projects: '@mintplayer/ng-spark,@spark-apps/*,@spark-demo/*,@mintplayer/coverage-upload-action,@mintplayer/dependency-update-action' }
          # Everything not named above, so a new test project runs without being added here. Keep this list
          # in step with the entries above.
          - { name: Other suites, artifact: other, exclude: 'MintPlayer.Spark.Tests,MintPlayer.Spark.E2E.Tests,CodeCoverage.Tests,SeoTester.Tests,MintPlayer.Spark.SourceGenerators.Tests,MintPlayer.Spark.Client.Tests,MintPlayer.Spark.Gs1.Tests,MintPlayer.Migration.Tests,CodeCoverage.Git.Tests,CodeCoverage.GitMirror.Tests,CodeCoverage.GitWriter.Tests,DemoApp.Tests,SparkId.Tests,Fleet.Tests,QnA.Tests,HR.Tests,@mintplayer/ng-spark,@spark-apps/*,@spark-demo/*,@mintplayer/coverage-upload-action,@mintplayer/dependency-update-action' }
          # The dependency-update action against real package managers and LOCAL registries
          # (docs/code-coverage/dependency-updates-PRD.md §13.11.2): its own `test-integration` target, so
          # "Other suites" (target `test`) never runs it. One slice per ecosystem group, 15 minutes each;
          # the Nx cache makes an unchanged action about a minute.
          - { name: 'dependency-action IT node+dotnet', artifact: dep-it-node-dotnet, projects: '@mintplayer/dependency-update-action', target: test-integration, itGroup: 'node+dotnet', timeout: 15 }
          - { name: 'dependency-action IT jvm', artifact: dep-it-jvm, projects: '@mintplayer/dependency-update-action', target: test-integration, itGroup: 'jvm', timeout: 15 }
          - { name: 'dependency-action IT python+go+rust+php', artifact: dep-it-python-go-rust-php, projects: '@mintplayer/dependency-update-action', target: test-integration, itGroup: 'python+go+rust+php', timeout: 15 }
          - { name: 'dependency-action IT docker+renovate', artifact: dep-it-docker-renovate, projects: '@mintplayer/dependency-update-action', target: test-integration, itGroup: 'docker+renovate', timeout: 15 }

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup
      uses: ./.github/actions/setup
      with:
        nuget-token: ${{ github.token }}

    - name: Playwright
      if: matrix.playwright
      uses: ./.github/actions/playwright

    # The package managers ubuntu-latest lacks, at the versions the S13/S14 spikes ran. npm, yarn,
    # dotnet, java/maven/gradle, go, cargo, php/composer and docker are on the image already.
    - name: Integration toolchains
      if: matrix.itGroup == 'node+dotnet' || matrix.itGroup == 'python+go+rust+php'
      run: |
        npm install -g pnpm@10.18.0 --ignore-scripts
        pipx install uv==0.13.1

    - name: Run tests
      # Step-level, so a hung suite fails here and the artifact upload below still runs with what the
      # suite produced. The large .NET suites also carry --blame-hang (5-10 min per test) in their nx
      # command, which names the hung test instead of just timing out.
      timeout-minutes: ${{ matrix.timeout || 20 }}
      # --output-style=stream: nx buffers each task's output until the task finishes, so a hung task
      # prints NOTHING. Streaming trades tidy grouping for a visible last line.
      run: |
        if [ -n "${{ matrix.projects }}" ]; then
          npx nx run-many --target=${{ matrix.target || 'test' }} --projects='${{ matrix.projects }}' --output-style=stream
        else
          npx nx run-many --target=test --exclude='${{ matrix.exclude }}' --output-style=stream
        fi
      env:
        # The integration tests' ecosystem slice; unset for every other suite.
        DEP_ACTION_IT_GROUP: ${{ matrix.itGroup }}
        # Only the integration slices see it, for Renovate's GitHub tag lookups (read-only).
        GITHUB_TOKEN: ${{ matrix.itGroup && github.token || '' }}
        RAVENDB_LICENSE: ${{ !matrix.itGroup && secrets.RAVENDB_LICENSE || '' }}
        # Read by tools/test-shard.mjs; an input of the MintPlayer.Spark.Tests task, so each shard is
        # cached on its own.
        SPARK_TEST_SHARD: ${{ matrix.shard }}

    # upload-artifact roots the artifact at the deepest folder ALL matched files share, so a job that only
    # produced tests/MintPlayer.Spark.Tests/coverage/** would lose that prefix, and the coverage job would
    # put the reports where the server cannot resolve them. A file at the workspace root pins the root.
    - name: Pin the artifact root
      if: always()
      run: echo "${{ matrix.name }}" > coverage-artifact-root.txt

    # The same globs the coverage upload reads, plus the shards' trx files (per-class timings for
    # tools/test-shard.mjs --timings). Paths stay relative to the workspace root, so the coverage job can
    # download every artifact into one checkout and see the layout a single job used to produce.
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-${{ matrix.artifact }}
        path: |
          coverage-artifact-root.txt
          tests/*/coverage/**/coverage.cobertura.xml
          tests/*/coverage/*.trx
          apps/*/*/coverage/*.trx
          apps/CodeCoverage/*/coverage/**/coverage.cobertura.xml
          libs/node_packages/*/coverage/cobertura-coverage.xml
          apps/CodeCoverage/CodeCoverage/ClientApp/coverage/cobertura-coverage.xml
          coverage/@spark-apps/code-coverage/cobertura-coverage.xml
          apps/CodeCoverage/action/coverage/cobertura-coverage.xml
          apps/CodeCoverage/dependency-action/coverage/cobertura-coverage.xml
        if-no-files-found: ignore
        retention-days: 7
