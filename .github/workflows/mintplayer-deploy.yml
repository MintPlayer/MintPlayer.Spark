name: mintplayer-deploy

# Deploys apps/MintPlayer to mintplayer.com, on the VPS beside CodeCoverage and SeoTester
# (docs/mintplayer_website_plan.md 0.6–0.8). Modelled on seotester-deploy.yml: ghcr → SSH → compose, the same
# repository secrets (VPS_*), the same readiness loop. One image: ghcr.io/mintplayer/mintplayer:master.

on:
  push:
    branches:
      - master
    paths:
      - 'apps/MintPlayer/MintPlayer/**'
      - 'apps/MintPlayer/MintPlayer.Library/**'
      - 'apps/MintPlayer/docker-compose.yml'
      # MintPlayer's transitive ProjectReference closure, the same list as the Dockerfile's COPY lines and
      # mintplayer-image-check.yml (tools/verify-mintplayer-deploy.test.mjs keeps the three equal to the csproj graph).
      - 'libs/attributes/MintPlayer.Spark.Attributes/**'
      - 'libs/authorization/MintPlayer.Spark.Authorization/**'
      - 'libs/authorization/MintPlayer.Spark.Authorization.Abstractions/**'
      - 'libs/history/MintPlayer.Spark.History/**'
      - 'libs/history/MintPlayer.Spark.History.Abstractions/**'
      - 'libs/mail/MintPlayer.Spark.MailManager/**'
      - 'libs/mail/MintPlayer.Spark.MailManager.Abstractions/**'
      - 'libs/messaging/MintPlayer.Spark.Messaging/**'
      - 'libs/messaging/MintPlayer.Spark.Messaging.Abstractions/**'
      - 'libs/migrations/MintPlayer.Spark.Migrations/**'
      - 'libs/model/MintPlayer.Spark.Model/**'
      - 'libs/soft_delete/MintPlayer.Spark.SoftDelete/**'
      - 'libs/soft_delete/MintPlayer.Spark.SoftDelete.Abstractions/**'
      - 'libs/source_generators/MintPlayer.Spark.LibraryGenerators/**'
      - 'libs/source_generators/MintPlayer.Spark.SourceGenerators/**'
      - 'libs/spark/MintPlayer.Spark/**'
      - 'libs/spark/MintPlayer.Spark.SafeHttp/**'
      - 'libs/spark/MintPlayer.Spark.Abstractions/**'
      - 'libs/subscription_worker/MintPlayer.Spark.SubscriptionWorker.Abstractions/**'
      # Angular libraries baked into the image via `nx run @spark-apps/mint-player:build`.
      - 'libs/node_packages/ng-spark/**'
      # Workspace-level files that affect the build.
      - 'package.json'
      - 'package-lock.json'
      - 'nx.json'
      - 'tsconfig.base.json'
      - '.github/workflows/mintplayer-deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mintplayer/mintplayer

jobs:
  build-and-push:

    name: Build and push the MintPlayer image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # No host .NET/Node setup: the Dockerfile's build stage restores, runs `npm ci`, the Nx build and
    # `dotnet publish` inside the container (--skip-nx-cache: the shipped image is never replayed from a cache).
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Authenticate with GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract tags/labels
      id: meta-ghcr
      uses: docker/metadata-action@v6
      with:
        github-token: ${{ github.token }}
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    - name: Build and push Docker image
      id: push-ghcr
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./apps/MintPlayer/MintPlayer/Dockerfile
        push: true
        tags: ${{ steps.meta-ghcr.outputs.tags }}
        labels: ${{ steps.meta-ghcr.outputs.labels }}
        cache-from: type=gha,scope=mintplayer
        cache-to: type=gha,mode=max,scope=mintplayer

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.push-ghcr.outputs.digest }}
        push-to-registry: true

    # Best-effort, as SeoTester's: the package must be public for the VPS to pull without credentials. Verify in
    # the package settings after the first run rather than trusting this step.
    - name: Make the package public
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method PATCH -H "Accept: application/vnd.github+json" \
          "/orgs/${{ github.repository_owner }}/packages/container/mintplayer" \
          -f visibility=public 2>&1 || echo "(skipped — already public, missing, or insufficient token scope)"

  deploy:

    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Room for pull + restart plus the 360s readiness bound below.
    timeout-minutes: 20
    needs: [build-and-push]
    if: github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: read

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
        envs: GITHUB_TOKEN
        script: |
          # Fail on the FIRST failing command (code-coverage-deploy.yml learned this the hard way).
          set -e

          mkdir -p /var/www/mintplayer
          cd /var/www/mintplayer

          # .env is server-managed; deploys never write it. Only the compose file is refreshed from the repo.
          test -f .env || { echo "::error::/var/www/mintplayer/.env is missing (docs/mintplayer_website_plan.md 0.7)"; exit 1; }
          # RavenDB is secured: this app's client certificate and the CA must be on the server. Presence only.
          for f in raven-certs/mintplayer.crt raven-certs/mintplayer.key raven-certs/ca.crt; do
            test -s "$f" || { echo "::error::/var/www/mintplayer/$f is missing (docs/mintplayer_website_plan.md 0.7)"; exit 1; }
          done
          # The two backend networks shared with CodeCoverage (mintplayer-raven: coverage-raven + mintplayer-app;
          # mintplayer-mail: coverage-smtp + mintplayer-app). External to every compose project, so they are created here,
          # INTERNAL (no route out), when missing; idempotent, and a concurrent create by the other deploy is fine (the
          # second inspect finds it). A network of that name that is not internal is refused rather than used. Same block in
          # code-coverage-deploy.yml.
          for net in mintplayer-raven mintplayer-mail; do
            docker network inspect "$net" > /dev/null 2>&1 || docker network create --internal "$net" > /dev/null 2>&1 || docker network inspect "$net" > /dev/null
            [ "$(docker network inspect -f '{{.Internal}}' "$net")" = "true" ] || { echo "::error::the network $net exists but is not internal: remove it (docker network rm $net) once nothing uses it, then redeploy"; exit 1; }
          done
          # The database and the mail relay are CodeCoverage's: refuse (before touching the running stack) until its
          # coverage-raven and coverage-smtp are on the shared networks, i.e. until CodeCoverage was deployed with the compose file that joins them.
          docker network inspect mintplayer-raven --format '{{range .Containers}}{{.Name}} {{end}}' | grep -q 'coverage-raven' || { echo "::error::coverage-raven is not on the network mintplayer-raven — deploy CodeCoverage first"; exit 1; }
          docker network inspect mintplayer-mail --format '{{range .Containers}}{{.Name}} {{end}}' | grep -q 'coverage-smtp' || { echo "::error::coverage-smtp is not on the network mintplayer-mail — deploy CodeCoverage first"; exit 1; }

          rm -f docker-compose.yml
          curl -sf -H "Authorization: token $GITHUB_TOKEN" -o docker-compose.yml \
            https://raw.githubusercontent.com/${{ github.repository }}/master/apps/MintPlayer/docker-compose.yml

          echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker compose --env-file .env pull
          docker compose --env-file .env down --remove-orphans
          docker compose --env-file .env up -d --remove-orphans

          docker image prune -f
          docker compose --env-file .env ps

          # Readiness that can fail. The bound is a FAILURE bound (the loop exits on the first 200): mintplayer-app's
          # healthcheck start_period (300s) plus one minute, 36 probes 10s apart. Keep the two in step.
          for i in $(seq 1 36); do
            sleep 10
            code=$(docker compose --env-file .env exec -T mintplayer-app bash -c "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 && head -1 <&3" | grep -o '[0-9][0-9][0-9]' | head -1 || echo 000)
            echo "readiness attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
          done
          echo "::error::mintplayer-app did not become ready within 360s — docker compose logs mintplayer-app"
          exit 1
