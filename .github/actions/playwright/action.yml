name: Playwright Chromium
description: >
  Installs Chromium for the browser tests (MintPlayer.Spark.E2E.Tests and SeoTester.Tests), at the
  Microsoft.Playwright version the E2E project pins. Run after the setup action (needs npx).

runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: |
        version=$(grep -oE 'Microsoft\.Playwright"[[:space:]]*Version="[^"]+"' tests/MintPlayer.Spark.E2E.Tests/MintPlayer.Spark.E2E.Tests.csproj \
          | grep -oE 'Version="[^"]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "Playwright version: ${version}"
        # SeoTester's browser tests use the browsers installed for this version: one version.
        seo=$(grep -oE 'Microsoft\.Playwright"[[:space:]]*Version="[^"]+"' apps/SeoTester/SeoTester/SeoTester.csproj \
          | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
        [ "$seo" = "$version" ] || { echo "::error::Microsoft.Playwright is ${version} in the E2E tests but ${seo} in SeoTester: keep them equal, the CI installs one set of browsers"; exit 1; }

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # "-2": the first key's entry lacks chromium_headless_shell and a cache entry is never overwritten.
        key: ${{ runner.os }}-playwright-2-${{ steps.version.outputs.version }}

    # Installed before any test project starts: SeoTester.Tests' render tests only USE Chromium, and under
    # nx's parallel run they started before the E2E fixture had installed it (PR #505). Node's Playwright at
    # the SAME version installs the same builds (1.63.0 → chromium-1243 and chromium_headless_shell-1243,
    # checked with --dry-run).
    # Always run, cache hit or not: install skips the builds already present and fetches only what is missing.
    # A cache hit is no proof of completeness: the key was first saved (2026-10-09) by an older workflow
    # without chromium_headless_shell, and skipping the install on a hit left every SeoTester render test with
    # "Executable doesn't exist" (PR #512; master hid it behind an nx remote-cache replay).
    #
    # Bounded and retried: `--with-deps` runs apt-get against the runner's Azure Ubuntu mirror, and apt has no
    # overall deadline. On PR #531 (run 39820864227) one job sat in this step for 12+ minutes on fetches the
    # mirror never answered ("Ign:" lines), while the same install took under a minute in three sibling jobs.
    # Short fetch timeouts make apt fail over and retry instead of waiting, and each attempt is capped.
    - name: Install Chromium
      shell: bash
      run: |
        printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
          | sudo tee /etc/apt/apt.conf.d/99ci-timeouts > /dev/null
        for attempt in 1 2 3; do
          timeout 240 npx --yes playwright@${{ steps.version.outputs.version }} install --with-deps chromium && exit 0
          echo "::warning::Playwright install attempt $attempt failed or took over 4 minutes; retrying."
          # timeout stops npx, not the apt-get it started under sudo, which would keep the dpkg lock.
          sudo pkill -x apt-get || true
          sleep 2
          sudo dpkg --configure -a || true
        done
        echo "::error::Playwright install failed three times."
        exit 1
