name: Spark regenerate
description: >
  The post-rebase step of the CodeCoverage merge queue. On the commit the queue prepared, builds each Spark
  app, runs --spark-synchronize-model and --spark-synchronize-security twice (the second run must change
  nothing), and uploads the resulting `git diff --binary` as the `merge-queue-patch` artifact. It never
  commits or pushes and needs no secrets: the queue validates the patch and pushes it itself. With `lockfiles`, it
  first regenerates lockfiles through the sibling lockfile-regenerate action's scripts, into the same patch. See README.md.

# SECURITY: this action builds and runs the pull request's code. The calling workflow must grant only
# `contents: read`, pass no secrets, request no `id-token`, and run on a GitHub-hosted runner.

inputs:
  expected_sha:
    description: The full SHA the merge queue prepared (the dispatch input). The run fails if HEAD differs.
    required: true
  projects:
    description: The Spark app .csproj paths, one per line, relative to the repository root.
    required: true
  dotnet-version:
    description: SDK version for actions/setup-dotnet. Empty (the default) reads the repository's global.json.
    required: false
    default: ''
  configuration:
    description: Build configuration. Keep it equal to the one the repository's verify step runs.
    required: false
    default: Debug
  skip-spa-build:
    description: >
      Pass -p:EnableSpaBuilder=false, so MintPlayer.AspNetCore.SpaServices does not npm-install and build the
      Angular client. Synchronize reads only the .NET model, so the client is never needed here.
    required: false
    default: 'true'
  extra-build-args:
    description: Extra arguments for every `dotnet build`, split on whitespace.
    required: false
    default: ''
  contracts:
    description: >
      'true' also runs --spark-synchronize-contracts per app, rewriting its ClientApp/src/app/generated/contracts.ts (the
      TypeScript contracts, commerce X20). Default 'false': an app on a Spark release without the flag would fail on it.
    required: false
    default: 'false'
  library-contracts-project:
    description: >
      Optional. A tool .csproj whose `contracts` command writes library TypeScript contracts (this repository:
      tools/SchemaGenerator/MintPlayer.Spark.SchemaGenerator.csproj). Built with the apps and run after their synchronize.
      Empty (the default) skips it.
    required: false
    default: ''
  lockfiles:
    description: >
      Opt-in. Lockfile ecosystems to regenerate before the build, one per line - npm, pnpm, yarn, nuget - with the
      sibling lockfile-regenerate action's scripts (marker rebuild, fixed point, provenance). Empty (the default) changes
      nothing. Needs the checkout's fetch-depth: 2.
    required: false
    default: ''
  pr_number:
    description: >
      The pull request (the dispatch input). Used only with `lockfiles`: the pull request's head is fetched first, for
      the three-way marker rebuild and provenance against both sides. Empty: the fallback (lockfile-regenerate README).
    required: false
    default: ''
  token:
    description: >
      Used only with `lockfiles` and `pr_number`, to fetch refs/pull/<pr_number>/head of a private repository, before any
      of the pull request's code runs; never written to disk. The job's own token (contents: read); '' fetches anonymously.
    required: false
    default: ${{ github.token }}

outputs:
  changed:
    description: '"true" when the patch is non-empty.'
    value: ${{ steps.regenerate.outputs.changed }}
  file-count:
    description: The number of files the patch touches.
    value: ${{ steps.regenerate.outputs.file-count }}
  patch-path:
    description: The patch file on the runner.
    value: ${{ steps.regenerate.outputs.patch-path }}

runs:
  using: composite
  steps:
    # First, before anything reads the pull request's files: the only step that may hold a token.
    - name: Fetch the pull request's head (lockfiles)
      id: pr
      if: inputs.lockfiles != '' && inputs.pr_number != ''
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        FETCH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/../lockfile-regenerate/fetch-pr-head.sh"

    - name: Setup .NET (global.json)
      if: inputs.dotnet-version == ''
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Setup .NET (${{ inputs.dotnet-version }})
      if: inputs.dotnet-version != ''
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Regenerate
      id: regenerate
      shell: bash
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
        PROJECTS: ${{ inputs.projects }}
        CONFIGURATION: ${{ inputs.configuration }}
        BUILD_ARGS: ${{ inputs.skip-spa-build == 'true' && '-p:EnableSpaBuilder=false ' || '' }}${{ inputs.extra-build-args }}
        LOCKFILES: ${{ inputs.lockfiles }}
        CONTRACTS: ${{ inputs.contracts }}
        LIBRARY_CONTRACTS_PROJECT: ${{ inputs.library-contracts-project }}
        PR_HEAD: ${{ steps.pr.outputs.pr-head }}
        MERGE_BASE: ${{ steps.pr.outputs.merge-base }}
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
      run: bash "$GITHUB_ACTION_PATH/regenerate.sh"

    # Uploaded even when empty: an empty patch from a green run means "nothing to regenerate", while a
    # failed run or a missing artifact means the queue evicts. Short retention: the queue downloads it
    # within minutes (postRebaseTimeout).
    - name: Upload merge-queue-patch
      uses: actions/upload-artifact@v7
      with:
        name: merge-queue-patch
        path: ${{ steps.regenerate.outputs.patch-path }}
        if-no-files-found: error
        retention-days: 3
